/* @section: design-system — FactoryAI2U industrial control-room theme */
:root {
  color-scheme: dark;
  --bg: #0b1220;
  --bg-2: #0e1728;
  --surface: #131f36;
  --surface-2: #182742;
  --surface-3: #1f3252;
  --text: #eaf0fb;
  --muted: #9fb0cc;
  --faint: #6c7fa0;
  --border: #24344f;
  --border-strong: #33496c;
  --primary: #2f7bff;
  --primary-strong: #1e5fd6;
  --accent: #23c2a0;

  /* Status palette (design manual: open/active/escalated/contained/restored/overdue/closed) */
  --st-open: #4aa3ff;
  --st-active: #f5a623;
  --st-escalated: #ff5a5f;
  --st-contained: #b57bff;
  --st-restored: #23c2a0;
  --st-overdue: #ff3b57;
  --st-closed: #7f8ea8;
  --danger: #ff5a5f;
  --warn: #f5a623;
  --ok: #23c2a0;

  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --shadow-sm: 0 6px 18px rgba(0, 0, 0, 0.35);
  --radius: 12px;
  --radius-sm: 8px;
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-5: 1.5rem; --space-6: 2rem; --space-7: 3rem;
  --nav-h: 60px;
  --tab-h: 64px;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(1200px 600px at 80% -10%, #16233f 0%, var(--bg) 55%) fixed, var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
h1, h2, h3, h4 { margin: 0 0 var(--space-3); line-height: 1.2; font-weight: 700; }
h1 { font-size: 1.4rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
p { margin: 0 0 var(--space-3); }
a { color: var(--primary); text-decoration: none; }
button { font-family: inherit; }
small { color: var(--muted); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

/* ---------- Layout shell ---------- */
.app-shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 40;
  height: var(--nav-h); display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-4);
  background: rgba(11, 18, 32, 0.9); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .3px; }
.topbar .brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.topbar .spacer { flex: 1; }
.topbar .role-chip { font-size: .78rem; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--muted); }
.topbar .icon-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; }
.topbar .icon-btn:hover { border-color: var(--border-strong); }

.layout { flex: 1; display: flex; width: 100%; max-width: 1400px; margin: 0 auto; }
.sidebar {
  width: 244px; flex-shrink: 0; padding: var(--space-4) var(--space-3);
  border-right: 1px solid var(--border); position: sticky; top: var(--nav-h);
  height: calc(100vh - var(--nav-h)); overflow-y: auto;
}
.sidebar .nav-group { margin-bottom: var(--space-4); }
.sidebar .nav-group > .label { font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); padding: 0 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 11px 12px; border-radius: 10px; border: 1px solid transparent;
  background: none; color: var(--muted); cursor: pointer; text-align: left; font-size: .92rem;
}
.nav-item .ic { width: 20px; text-align: center; opacity: .9; }
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
.nav-item .badge { margin-left: auto; }

.content { flex: 1; min-width: 0; padding: var(--space-5); padding-bottom: calc(var(--tab-h) + 24px); }
.page-head { display: flex; align-items: flex-start; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; }
.page-head .titles { min-width: 0; }
.page-head .titles p { color: var(--muted); margin: 4px 0 0; font-size: .9rem; }
.page-head .actions { margin-left: auto; display: flex; gap: var(--space-2); flex-wrap: wrap; }

/* Bottom tab bar (mobile) */
.tabbar { display: none; }

/* ---------- Cards & grids ---------- */
.grid { display: grid; gap: var(--space-4); }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.card {
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface) 100%);
  border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4);
  box-shadow: var(--shadow-sm);
}
.card.clickable { cursor: pointer; transition: border-color .12s, transform .12s; }
.card.clickable:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.card h3 .sub { font-weight: 400; color: var(--muted); font-size: .8rem; }

.kpi { display: flex; flex-direction: column; gap: 6px; }
.kpi .k-label { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
.kpi .k-value { font-size: 1.9rem; font-weight: 800; line-height: 1; }
.kpi .k-value small { font-size: .9rem; font-weight: 600; color: var(--muted); }
.kpi .k-foot { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.kpi.drill { cursor: pointer; }
.kpi.drill:hover { color: var(--text); }
.trend-up { color: var(--ok); } .trend-down { color: var(--danger); }

/* ---------- Status chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid transparent; text-transform: uppercase; letter-spacing: .04em; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.open { color: var(--st-open); background: rgba(74,163,255,.12); }
.chip.active { color: var(--st-active); background: rgba(245,166,35,.12); }
.chip.escalated { color: var(--st-escalated); background: rgba(255,90,95,.14); }
.chip.contained { color: var(--st-contained); background: rgba(181,123,255,.14); }
.chip.restored { color: var(--st-restored); background: rgba(35,194,160,.14); }
.chip.overdue { color: var(--st-overdue); background: rgba(255,59,87,.16); }
.chip.closed { color: var(--st-closed); background: rgba(127,142,168,.14); }
.chip.rca { color: var(--st-contained); background: rgba(181,123,255,.14); }
.chip.plain { color: var(--muted); background: var(--surface-2); border-color: var(--border); }
.chip.crit { color: var(--danger); background: rgba(255,90,95,.14); }
.chip.major { color: var(--warn); background: rgba(245,166,35,.14); }
.chip.minor { color: var(--st-open); background: rgba(74,163,255,.12); }

.sev-dot { display:inline-block; width:9px;height:9px;border-radius:50%; margin-right:6px; }

/* ---------- Tables / lists ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; background: var(--surface-2); position: sticky; top: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }
td .muted { color: var(--muted); }

.list { display: flex; flex-direction: column; gap: var(--space-2); }
.list-row {
  display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
}
.list-row:hover { border-color: var(--border-strong); }
.list-row .lr-main { min-width: 0; flex: 1; }
.list-row .lr-main .t { font-weight: 600; }
.list-row .lr-main .s { color: var(--muted); font-size: .82rem; }
.list-row .lr-side { text-align: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }

/* ---------- Forms ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .82rem; color: var(--muted); font-weight: 600; }
.field label .req { color: var(--danger); }
input, select, textarea {
  width: 100%; background: var(--bg-2); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 10px; padding: 12px 12px; font-size: 1rem; min-height: 48px;
}
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47,123,255,.2); }
.field .hint { font-size: .75rem; color: var(--faint); }
.inline-fields { display: flex; gap: var(--space-2); flex-wrap: wrap; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 10px; font-size: .95rem; font-weight: 700;
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); cursor: pointer;
}
.btn:hover { border-color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-strong); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: .85rem; }
.btn.block { width: 100%; }
.btn.andon { background: linear-gradient(180deg,#ff6b6b,#ff3b57); border-color:#ff3b57; color:#fff; font-size:1.05rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: var(--space-2); flex-wrap: wrap; }

/* ---------- Auth / login ---------- */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: var(--space-4); }
.auth-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: var(--space-6); box-shadow: var(--shadow); }
.auth-card .brand { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
.auth-card .brand .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent); }
.auth-card .tag { color: var(--muted); margin-bottom: var(--space-5); font-size: .9rem; }
.role-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: var(--space-3) 0 var(--space-4); }
.role-pick .rp {
  padding: 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--bg-2);
  cursor: pointer; text-align: left; color: var(--text);
}
.role-pick .rp:hover { border-color: var(--primary); }
.role-pick .rp.sel { border-color: var(--primary); background: rgba(47,123,255,.12); }
.role-pick .rp.sel::after { content: "✓"; position: absolute; top: 8px; right: 10px; color: var(--primary); font-weight: 800; }
.role-pick .rp { position: relative; }
.login-hint { text-align: center; color: var(--muted); font-size: .82rem; margin-bottom: 10px; }
.preview-warn { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(245,166,35,.12); border: 1px solid var(--warn); color: #ffdca0; font-size: .78rem; line-height: 1.45; }
.role-pick .rp .rn { font-weight: 700; font-size: .92rem; }
.role-pick .rp .rd { font-size: .72rem; color: var(--muted); }

/* ---------- Misc ---------- */
.section-title { display: flex; align-items: center; gap: 10px; margin: var(--space-5) 0 var(--space-3); }
.section-title h2 { margin: 0; }
.section-title .line { flex: 1; height: 1px; background: var(--border); }
.muted { color: var(--muted); }
.pill-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--space-4); background: var(--surface); padding: 6px; border-radius: 12px; border: 1px solid var(--border); }
.pill-tabs button { flex: 1; min-width: max-content; border: none; background: none; color: var(--muted); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .88rem; }
.pill-tabs button.active { background: var(--surface-3); color: var(--text); }
.empty { text-align: center; padding: var(--space-6); color: var(--faint); border: 1px dashed var(--border-strong); border-radius: var(--radius); }
.empty .big { font-size: 2rem; margin-bottom: 8px; }
.breadcrumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-bottom: var(--space-4); }
.breadcrumbs button { background: none; border: none; color: var(--primary); cursor: pointer; font-size: .85rem; padding: 0; }
.breadcrumbs .sep { color: var(--faint); }
.stat-inline { display: flex; gap: var(--space-4); flex-wrap: wrap; }
.stat-inline .si { display: flex; flex-direction: column; }
.stat-inline .si .v { font-size: 1.3rem; font-weight: 800; }
.stat-inline .si .l { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 var(--space-4) 24px; border-left: 2px solid var(--border-strong); }
.timeline li:last-child { border-left-color: transparent; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); border: 2px solid var(--bg); }
.timeline li .tl-t { font-weight: 600; }
.timeline li .tl-m { font-size: .82rem; color: var(--muted); }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; font-size: .9rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }

/* Toast / modal / banners */
.toast-host { position: fixed; bottom: calc(var(--tab-h) + 16px); left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; width: min(420px, 92vw); }
.toast { background: var(--surface-3); border: 1px solid var(--border-strong); border-left: 4px solid var(--accent); padding: 12px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: .9rem; animation: slideup .2s ease; }
.toast.err { border-left-color: var(--danger); }
.toast.warn { border-left-color: var(--warn); }
@keyframes slideup { from { opacity: 0; transform: translateY(10px); } }
.modal-host { position: fixed; inset: 0; z-index: 100; background: rgba(3,7,16,.7); display: grid; place-items: center; padding: var(--space-4); overflow: auto; }
/* Modal is a flex column: head + scrollable body + always-visible sticky footer.
   Height is capped to the *visible* viewport (100dvh) so the footer/Save button
   is never pushed below the fold on mobile browsers with dynamic toolbars. */
.modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 16px; width: min(640px, 100%); max-height: calc(100dvh - 2 * var(--space-4)); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); }
.modal .m-head { flex: 0 0 auto; display: flex; align-items: center; padding: var(--space-4); border-bottom: 1px solid var(--border); background: var(--surface); }
.modal .m-head h2 { margin: 0; font-size: 1.1rem; } .modal .m-head .x { margin-left: auto; }
.modal .m-body { flex: 1 1 auto; padding: var(--space-4); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal .m-foot { flex: 0 0 auto; padding: var(--space-4); padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: flex-end; background: var(--surface); }
.modal .m-foot .btn { min-height: 44px; }
.net-banner { position: fixed; top: var(--nav-h); left: 0; right: 0; z-index: 39; text-align: center; padding: 6px; font-size: .8rem; font-weight: 600; background: var(--warn); color: #201400; }
.net-banner.offline { background: var(--faint); color: #06101f; }

/* ---------- Responsive: mobile ---------- */
@media (max-width: 900px) {
  .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
  .sidebar { display: none; }
  .content { padding: var(--space-4); }
  .form-grid { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 120px 1fr; }
  .tabbar {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 45; height: var(--tab-h);
    background: rgba(11,18,32,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--border);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button { flex: 1; background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .66rem; cursor: pointer; padding: 4px 2px; border-radius: 8px; }
  .tabbar button .ic { font-size: 1.25rem; }
  .tabbar button.active { color: var(--primary); }
  .tabbar button.andon-tab { color: var(--danger); }
}
@media (max-width: 560px) {
  .grid.cols-4, .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; }
  .role-pick { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr; gap: 2px 0; }
  .kv dt { margin-top: 8px; }
  h1 { font-size: 1.2rem; }
  .page-head .actions { width: 100%; }
}
@media (min-width: 901px) { .mobile-only { display: none !important; } }

/* dvh fallback for older browsers */
@supports not (height: 100dvh) {
  .modal { max-height: calc(100vh - 2 * var(--space-4)); }
}

/* Admin CRUD affordances */
.crud-bar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin: 6px 0 10px; }
.crud-bar .btn { min-height: 40px; }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; white-space: nowrap; }
.row-actions .btn { min-height: 34px; padding: 4px 10px; font-size: .8rem; }
table td.row-actions-cell { text-align: right; }
.andon-tab, .record-tab { color: var(--danger) !important; }
.record-tab .ic { font-size: 1.3rem; }
/* mobile "+ Record" primary action pill in tab bar */

  <script>
/* @section: data-layer — FactoryAI2U CORE data model, seed data & persistence
   NOTE (up to CORE V1.5 — database backend setup): This prototype persists to
   browser localStorage only. No live database is connected yet. Admin > Data
   Backend holds credentials for the CORE V1.5 shared-database connection but
   does NOT transmit or store secrets remotely at this stage. */
(function (global) {
  'use strict';

  var LS_KEY = 'factoryai2u.core.v1';
  var CFG_KEY = 'factoryai2u.dbconfig.v1';

  /* ---------- Roles & permissions (Design Manual §5) ---------- */
  var ROLES = {
    operator:     { name: 'Operator',      philosophy: 'Record → Report → Andon',                     mgmt: false },
    supervisor:   { name: 'Supervisor',    philosophy: 'Monitor → Respond → Control → Escalate',      mgmt: false },
    qa:           { name: 'QA / QC',       philosophy: 'Detect → Contain → Investigate → Correct',    mgmt: false },
    maintenance:  { name: 'Maintenance',   philosophy: 'Respond → Diagnose → Restore → Prevent',      mgmt: false },
    plant_head:   { name: 'Plant Head',    philosophy: 'See → Drill → Decide → Follow Up',            mgmt: true },
    division_head:{ name: 'Division Head', philosophy: 'Compare → Systemic Loss → Improvement',       mgmt: true },
    ceo:          { name: 'CEO',           philosophy: 'Business Impact → Drill → Decide',            mgmt: true },
    admin:        { name: 'Admin',         philosophy: 'Configure → Govern → Secure',                 mgmt: false }
  };

  // Menu access per role. Management roles never get working-level entry menus (Manual §5 critical rule).
  var MENUS = {
    operator:      ['dashboard','production','breakdown','quality','myitems','calculators'],
    supervisor:    ['dashboard','breakdown','quality','production','escalations','actions','myitems','calculators'],
    qa:            ['dashboard','quality','actions','rca','myitems','calculators'],
    maintenance:   ['dashboard','breakdown','actions','myitems','calculators'],
    plant_head:    ['dashboard','exceptions','loss','drilldown','actions','audit','calculators'],
    division_head: ['dashboard','exceptions','loss','drilldown','actions','audit','calculators'],
    ceo:           ['dashboard','exceptions','loss','drilldown','audit','calculators'],
    admin:         ['dashboard','admin','audit','calculators']
  };

  /* ---------- Escalation rules (Manual §6, §7) ---------- */
  var ESCALATION = {
    breakdown: [
      { min: 5,  to: 'Supervisor' },
      { min: 10, to: 'Production Head + Plant Head' },
      { min: 30, to: 'Division Head' },
      { min: 60, to: 'CEO' }
    ],
    quality: [
      { min: 10,   to: 'Supervisor' },
      { min: 60,   to: 'QA Head' },
      { min: 480,  to: 'Quality Division Head' },  // 1 shift ~ 8h
      { min: 1440, to: 'CEO' }                     // 1 day
    ]
  };

  var BREAKDOWN_CATEGORIES = ['Major','Minor','Mechanical','Electrical','Pneumatic','Hydraulic','Data Communication','Intermittent','Auto Stop','Manual Stop','Emergency Stop','Sudden Stop'];
  var BREAKDOWN_SYMPTOMS = ['Alert','Alarm','Abnormal Noise','Appearance','Vibration'];
  var QUALITY_CLASS = ['Safety Critical','Functional','Fitting','Appearance','Reliability','Dimensional'];
  var QUALITY_SEVERITY = ['Critical','Major','Minor','Observation'];
  var RUNNING_MODES = ['Normal Production','Trial','Auto','Manual'];

  function uid(p) { return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function nowISO() { return new Date().toISOString(); }
  function minAgo(m) { return new Date(Date.now() - m * 60000).toISOString(); }

  /* ---------- Seed (neutral fictional demo data — Manual §11) ---------- */
  function seed() {
    var users = [
      { id: 'u1', name: 'Aiman R.',   role: 'operator',      shift: 'A', scope: 'P1' },
      { id: 'u2', name: 'Siti N.',    role: 'supervisor',    shift: 'A', scope: 'P1' },
      { id: 'u3', name: 'Ravi K.',    role: 'qa',            shift: 'A', scope: 'P1' },
      { id: 'u4', name: 'Chong W.',   role: 'maintenance',   shift: 'A', scope: 'P1' },
      { id: 'u5', name: 'Faridah M.', role: 'plant_head',    shift: '-', scope: 'P1' },
      { id: 'u6', name: 'Daniel T.',  role: 'division_head', shift: '-', scope: 'D1' },
      { id: 'u7', name: 'Grace L.',   role: 'ceo',           shift: '-', scope: 'ALL' },
      { id: 'u8', name: 'Admin',      role: 'admin',         shift: '-', scope: 'ALL' }
    ];

    var org = {
      company: 'Generic Manufacturing Co.',
      divisions: [
        { id: 'D1', name: 'Division North' },
        { id: 'D2', name: 'Division South' }
      ],
      plants: [
        { id: 'P1', name: 'Plant Alpha', division: 'D1' },
        { id: 'P2', name: 'Plant Beta',  division: 'D2' }
      ],
      areas: [
        { id: 'A1', name: 'Machining',  plant: 'P1' },
        { id: 'A2', name: 'Assembly',   plant: 'P1' },
        { id: 'A3', name: 'Moulding',   plant: 'P2' }
      ],
      stages: [
        { id: 'S1', name: 'CNC Turning', area: 'A1' },
        { id: 'S2', name: 'Milling',     area: 'A1' },
        { id: 'S3', name: 'Final Assy',  area: 'A2' },
        { id: 'S4', name: 'Injection',   area: 'A3' }
      ],
      lines: [
        { id: 'L1', name: 'Line 1', stage: 'S1' },
        { id: 'L2', name: 'Line 2', stage: 'S2' },
        { id: 'L3', name: 'Line 3', stage: 'S3' },
        { id: 'L4', name: 'Line 4', stage: 'S4' }
      ],
      machines: [
        { id: 'M1', name: 'CNC-01', line: 'L1', type: 'CNC Lathe' },
        { id: 'M2', name: 'MILL-02', line: 'L2', type: 'VMC' },
        { id: 'M3', name: 'ASSY-03', line: 'L3', type: 'Assembly Cell' },
        { id: 'M4', name: 'IMM-04', line: 'L4', type: 'Injection Moulder' }
      ],
      products: [
        { id: 'PR1', part: 'Shaft-A', partNo: 'SA-1001', model: 'MX', customer: 'Customer Blue' },
        { id: 'PR2', part: 'Housing-B', partNo: 'HB-2002', model: 'MX', customer: 'Customer Blue' },
        { id: 'PR3', part: 'Cover-C', partNo: 'CC-3003', model: 'GT', customer: 'Customer Green' }
      ],
      shifts: [
        { id: 'A', name: 'Shift A', start: '07:00', end: '15:00' },
        { id: 'B', name: 'Shift B', start: '15:00', end: '23:00' },
        { id: 'C', name: 'Shift C', start: '23:00', end: '07:00' }
      ]
    };

    var kpiTargets = { oee: 85, quality: 99, fpy: 97, availability: 90, performance: 95 };

    // Standard rates (Manual §10 financial rule: configurable, demo values are NOT real costing)
    var rates = { downtimeCostPerMin: 8.5, scrapCostPerUnit: 4.2, ngReworkPerUnit: 1.8, currency: 'USD' };

    var production = [
      prod('L1','M1','PR1','A','u1', 620, 604, 16, 640, minAgo(300)),
      prod('L2','M2','PR2','A','u1', 480, 470, 10, 500, minAgo(220)),
      prod('L3','M3','PR3','A','u1', 300, 291, 9, 320, minAgo(120)),
      prod('L4','M4','PR2','A','u1', 540, 520, 20, 560, minAgo(60))
    ];

    var breakdowns = [
      bd('M1','L1','PR1','u1','A', 'Major','Abnormal Noise', 604, 45, 24, 'Spindle noise then stop', minAgo(52), 'escalated', null),
      bd('M2','L2','PR2','u1','A', 'Electrical','Alarm', 470, 12, 8, 'Servo alarm', minAgo(18), 'active', null),
      bd('M4','L4','PR2','u1','A', 'Pneumatic','Alert', 520, 30, 15, 'Air pressure drop', minAgo(140), 'restored', minAgo(105))
    ];

    var quality = [
      qa_('L1','PR1','u1','A', 'Dimensional','Major', 120, 14, 'M1', 'CNC Turning', 'OD out of tolerance', minAgo(70), 'containment'),
      qa_('L3','PR3','u1','A', 'Appearance','Minor', 40, 6, 'M3', 'Final Assy', 'Scratch on cover', minAgo(200), 'rca'),
      qa_('L2','PR2','u1','A', 'Functional','Critical', 200, 22, 'M2', 'Milling', 'Threaded hole missing', minAgo(30), 'open')
    ];

    var actions = [
      act('RCA / CA', 'Replace spindle bearing on CNC-01', 'u4', 'M1', addDays(1), 'open', 'breakdown', breakdowns[0].id),
      act('Corrective', 'Recalibrate OD gauge & 100% sort suspect lot', 'u3', 'M1', addDays(-1), 'overdue', 'quality', quality[0].id),
      act('Preventive', 'Add air-pressure sensor alarm threshold', 'u4', 'M4', addDays(3), 'open', 'breakdown', breakdowns[2].id)
    ];

    var audit = [
      log('u1','CREATE','Production event L1/CNC-01 recorded', minAgo(300)),
      log('u1','CREATE','Breakdown raised on CNC-01 (Major)', minAgo(52)),
      log('u2','ESCALATE','CNC-01 breakdown escalated to Plant Head', minAgo(42)),
      log('u3','CREATE','Quality alert on Shaft-A (Dimensional/Major)', minAgo(70)),
      log('u8','CONFIG','KPI targets updated (OEE 85%)', minAgo(1440))
    ];

    return {
      version: 1, users: users, org: org, kpiTargets: kpiTargets, rates: rates,
      config: { breakdownCategories: BREAKDOWN_CATEGORIES.slice(), breakdownSymptoms: BREAKDOWN_SYMPTOMS.slice(),
                qualityClass: QUALITY_CLASS.slice(), qualitySeverity: QUALITY_SEVERITY.slice(),
                escalation: JSON.parse(JSON.stringify(ESCALATION)) },
      production: production, breakdowns: breakdowns, quality: quality,
      actions: actions, rca: [], audit: audit, queue: []
    };

    function prod(line, machine, product, shift, by, plan, good, ng, total, ts) {
      return { id: uid('prd'), line: line, machine: machine, product: product, shift: shift, by: by,
               plan: plan, good: good, ng: ng, total: total, ts: ts };
    }
    function bd(machine, line, product, by, shift, cat, sym, outAt, affected, dtMin, notes, start, status, restored) {
      return { id: uid('bd'), machine: machine, line: line, product: product, by: by, shift: shift,
               runningMode: 'Normal Production', category: cat, symptom: sym, outputAtDowntime: outAt,
               affectedQty: affected, downtimeMin: dtMin, notes: notes, start: start, status: status,
               restoredAt: restored, escalationLevel: 0 };
    }
    function qa_(line, product, by, shift, cls, sev, suspect, confirmedNG, machine, process, desc, ts, status) {
      return { id: uid('ql'), line: line, product: product, by: by, shift: shift, classification: cls,
               severity: sev, suspectQty: suspect, confirmedNG: confirmedNG, machine: machine, process: process,
               defectDesc: desc, ts: ts, status: status };
    }
    function act(type, desc, owner, machine, due, status, srcType, srcId) {
      return { id: uid('act'), type: type, desc: desc, owner: owner, machine: machine, due: due,
               status: status, srcType: srcType, srcId: srcId, created: nowISO() };
    }
    function log(uid_, action, detail, ts) { return { id: uid('lg'), user: uid_, action: action, detail: detail, ts: ts }; }
    function addDays(d) { var x = new Date(); x.setDate(x.getDate() + d); return x.toISOString(); }
  }

  /* ---------- Store ---------- */
  var _state = null;
  // Expose org children (plants/areas/stages/lines/machines/products/shifts/divisions)
  // as top-level references so both s.org.* (display lookups) and s.* (forms & CRUD) work.
  function bindOrg(st) {
    if (!st || !st.org) return st;
    var keys = ['divisions','plants','areas','stages','lines','machines','products','shifts'];
    keys.forEach(function (k) { if (!st.org[k]) st.org[k] = []; st[k] = st.org[k]; });
    return st;
  }
  function load() {
    if (_state) return _state;
    try { var raw = localStorage.getItem(LS_KEY); if (raw) { _state = bindOrg(JSON.parse(raw)); return _state; } } catch (e) {}
    _state = bindOrg(seed()); save(); return _state;
  }
  function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(_state)); } catch (e) {} }
  function reset() { _state = bindOrg(seed()); save(); return _state; }

  function addAudit(user, action, detail) {
    load().audit.unshift({ id: uid('lg'), user: user, action: action, detail: detail, ts: nowISO() });
    save();
  }

  /* ---------- DB config (CORE V1.5 — database backend setup) ---------- */
  function getDbConfig() {
    try { var raw = localStorage.getItem(CFG_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return { provider: '', url: '', anonKey: '', serviceRoleHint: '', dbName: '', region: '', savedAt: '', connected: false };
  }
  function saveDbConfig(cfg) {
    cfg.savedAt = nowISO(); cfg.connected = false; // live connection is activated in the CORE V1.5 backend phase
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
    return cfg;
  }

  /* ---------- Lookups ---------- */
  function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function name(kind, id) {
    var s = load().org, m;
    if (kind === 'machine') { m = byId(s.machines, id); return m ? m.name : id; }
    if (kind === 'line')    { m = byId(s.lines, id);    return m ? m.name : id; }
    if (kind === 'product') { m = byId(s.products, id); return m ? (m.part + ' (' + m.partNo + ')') : id; }
    if (kind === 'user')    { m = byId(s.users, id);    return m ? m.name : id; }
    if (kind === 'plant')   { m = byId(s.plants, id);   return m ? m.name : id; }
    return id;
  }

  global.DB = {
    LS_KEY: LS_KEY, ROLES: ROLES, MENUS: MENUS, ESCALATION: ESCALATION,
    BREAKDOWN_CATEGORIES: BREAKDOWN_CATEGORIES, BREAKDOWN_SYMPTOMS: BREAKDOWN_SYMPTOMS,
    QUALITY_CLASS: QUALITY_CLASS, QUALITY_SEVERITY: QUALITY_SEVERITY, RUNNING_MODES: RUNNING_MODES,
    load: load, save: save, reset: reset, addAudit: addAudit,
    getDbConfig: getDbConfig, saveDbConfig: saveDbConfig,
    uid: uid, nowISO: nowISO, minAgo: minAgo, byId: byId, name: name
  };
})(window);

  <script>
/* @section: calculators — Free manufacturing performance calculators
   Categories: Production, Quality, Equipment, Workers, Material, Financial.
   Each calculator declares inputs {key,label,unit,def} and a compute() that
   returns {value, unit, note} plus optional extra rows. Formulas are standard,
   widely-used manufacturing definitions. */
(function (global) {
  'use strict';

  function pct(n) { return (isFinite(n) ? (Math.round(n * 100) / 100) : 0); }
  function safe(n) { n = parseFloat(n); return isNaN(n) ? 0 : n; }
  function div(a, b) { return b === 0 ? 0 : a / b; }

  var CALCS = [
    /* ---------------- PRODUCTION ---------------- */
    {
      id: 'oee', cat: 'Production', name: 'OEE (Overall Equipment Effectiveness)',
      desc: 'Availability × Performance × Quality — the headline production KPI.',
      inputs: [
        { key: 'planned', label: 'Planned Production Time', unit: 'min', def: 480 },
        { key: 'downtime', label: 'Downtime', unit: 'min', def: 45 },
        { key: 'ideal', label: 'Ideal Cycle Time', unit: 'sec/pc', def: 30 },
        { key: 'total', label: 'Total Units Produced', unit: 'pcs', def: 820 },
        { key: 'good', label: 'Good Units', unit: 'pcs', def: 800 }
      ],
      compute: function (v) {
        var runTime = safe(v.planned) - safe(v.downtime);
        var avail = div(runTime, safe(v.planned));
        var perf = div((safe(v.ideal) / 60) * safe(v.total), runTime);
        var qual = div(safe(v.good), safe(v.total));
        var oee = avail * perf * qual;
        return { value: pct(oee * 100), unit: '%',
          rows: [
            ['Availability', pct(avail * 100) + ' %'],
            ['Performance', pct(perf * 100) + ' %'],
            ['Quality', pct(qual * 100) + ' %']
          ], note: 'World-class benchmark ≈ 85%.' };
      }
    },
    {
      id: 'availability', cat: 'Production', name: 'Availability',
      desc: 'Run time as a share of planned production time.',
      inputs: [
        { key: 'planned', label: 'Planned Time', unit: 'min', def: 480 },
        { key: 'downtime', label: 'Downtime', unit: 'min', def: 60 }
      ],
      compute: function (v) { var a = div(safe(v.planned) - safe(v.downtime), safe(v.planned));
        return { value: pct(a * 100), unit: '%', note: 'Run Time ÷ Planned Time.' }; }
    },
    {
      id: 'performance', cat: 'Production', name: 'Performance Efficiency',
      desc: 'Actual output speed vs ideal cycle time.',
      inputs: [
        { key: 'ideal', label: 'Ideal Cycle Time', unit: 'sec/pc', def: 30 },
        { key: 'total', label: 'Total Units', unit: 'pcs', def: 820 },
        { key: 'runtime', label: 'Run Time', unit: 'min', def: 420 }
      ],
      compute: function (v) { var p = div((safe(v.ideal) / 60) * safe(v.total), safe(v.runtime));
        return { value: pct(p * 100), unit: '%', note: '(Ideal Cycle × Total) ÷ Run Time.' }; }
    },
    {
      id: 'takt', cat: 'Production', name: 'Takt Time',
      desc: 'Pace of production required to meet customer demand.',
      inputs: [
        { key: 'avail', label: 'Available Time', unit: 'min', def: 450 },
        { key: 'demand', label: 'Customer Demand', unit: 'pcs', def: 900 }
      ],
      compute: function (v) { var t = div(safe(v.avail) * 60, safe(v.demand));
        return { value: pct(t), unit: 'sec/pc', note: 'One unit must complete every ' + pct(t) + ' s to meet demand.' }; }
    },
    {
      id: 'cycletime', cat: 'Production', name: 'Cycle Time & Throughput',
      desc: 'Average time per unit and units per hour.',
      inputs: [
        { key: 'runtime', label: 'Run Time', unit: 'min', def: 420 },
        { key: 'units', label: 'Units Produced', unit: 'pcs', def: 820 }
      ],
      compute: function (v) { var ct = div(safe(v.runtime) * 60, safe(v.units)); var tph = div(safe(v.units), safe(v.runtime) / 60);
        return { value: pct(ct), unit: 'sec/pc', rows: [['Throughput', pct(tph) + ' pcs/hr']], note: 'Run Time ÷ Units.' }; }
    },
    {
      id: 'capacity', cat: 'Production', name: 'Capacity Utilisation',
      desc: 'Actual output vs maximum possible output.',
      inputs: [
        { key: 'actual', label: 'Actual Output', unit: 'pcs', def: 820 },
        { key: 'max', label: 'Maximum Capacity', unit: 'pcs', def: 1000 }
      ],
      compute: function (v) { var u = div(safe(v.actual), safe(v.max));
        return { value: pct(u * 100), unit: '%', note: 'Actual ÷ Maximum Capacity.' }; }
    },

    /* ---------------- QUALITY ---------------- */
    {
      id: 'fpy', cat: 'Quality', name: 'First Pass Yield (FPY)',
      desc: 'Units passing without rework, as a share of units started.',
      inputs: [
        { key: 'started', label: 'Units Started', unit: 'pcs', def: 1000 },
        { key: 'rework', label: 'Reworked Units', unit: 'pcs', def: 25 },
        { key: 'scrap', label: 'Scrapped Units', unit: 'pcs', def: 15 }
      ],
      compute: function (v) { var good = safe(v.started) - safe(v.rework) - safe(v.scrap); var y = div(good, safe(v.started));
        return { value: pct(y * 100), unit: '%', note: '(Started − Rework − Scrap) ÷ Started.' }; }
    },
    {
      id: 'ppm', cat: 'Quality', name: 'Defect Rate (PPM)',
      desc: 'Defective parts per million — supplier/quality standard.',
      inputs: [
        { key: 'defects', label: 'Defective Units', unit: 'pcs', def: 12 },
        { key: 'total', label: 'Total Inspected', unit: 'pcs', def: 5000 }
      ],
      compute: function (v) { var ppm = div(safe(v.defects), safe(v.total)) * 1e6;
        return { value: Math.round(ppm), unit: 'PPM', rows: [['Defect %', pct(div(safe(v.defects), safe(v.total)) * 100) + ' %']], note: '(Defects ÷ Total) × 1,000,000.' }; }
    },
    {
      id: 'scraprate', cat: 'Quality', name: 'Scrap & Rework Rate',
      desc: 'Share of production scrapped or reworked.',
      inputs: [
        { key: 'scrap', label: 'Scrap Units', unit: 'pcs', def: 15 },
        { key: 'rework', label: 'Rework Units', unit: 'pcs', def: 25 },
        { key: 'total', label: 'Total Produced', unit: 'pcs', def: 1000 }
      ],
      compute: function (v) { var s = div(safe(v.scrap), safe(v.total)); var r = div(safe(v.rework), safe(v.total));
        return { value: pct(s * 100), unit: '% scrap', rows: [['Rework Rate', pct(r * 100) + ' %'], ['Combined', pct((s + r) * 100) + ' %']], note: 'Scrap ÷ Total.' }; }
    },
    {
      id: 'sigma', cat: 'Quality', name: 'Process Sigma (approx.)',
      desc: 'Approximate sigma level from defect rate (DPMO).',
      inputs: [
        { key: 'defects', label: 'Defects', unit: 'ea', def: 12 },
        { key: 'units', label: 'Units', unit: 'pcs', def: 5000 },
        { key: 'opps', label: 'Opportunities / Unit', unit: 'ea', def: 1 }
      ],
      compute: function (v) {
        var dpmo = div(safe(v.defects), safe(v.units) * safe(v.opps)) * 1e6;
        var yieldp = 1 - div(safe(v.defects), safe(v.units) * safe(v.opps));
        // Approximate sigma: normsinv(yield) + 1.5 shift
        var sigma = approxSigma(yieldp) + 1.5;
        return { value: pct(sigma), unit: 'σ', rows: [['DPMO', Math.round(dpmo)], ['Yield', pct(yieldp * 100) + ' %']], note: 'Includes 1.5σ long-term shift.' };
      }
    },
    {
      id: 'cpk', cat: 'Quality', name: 'Process Capability (Cp / Cpk)',

  function approxSigma(p) {
    // rational approximation of the inverse normal CDF (Acklam) for yield->z
    if (p <= 0) return 0; if (p >= 1) return 6;
    var a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
    var b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01];
    var c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
    var d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
    var pl = 0.02425, ph = 1 - pl, q, r, z;
    if (p < pl) { q = Math.sqrt(-2 * Math.log(p)); z = (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
    else if (p <= ph) { q = p - 0.5; r = q*q; z = (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
    else { q = Math.sqrt(-2 * Math.log(1-p)); z = -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
    return z;
  }

  var CATEGORIES = ['Production', 'Quality', 'Equipment', 'Workers', 'Material', 'Financial'];

  <script>
/* @section: page-interactions — FactoryAI2U CORE app controller */
document.documentElement.classList.add('js-ready');
(function () {

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function el(id) { return document.getElementById(id); }
  function num(n) { n = Number(n); return isNaN(n) ? 0 : n; }
  function fmt(n) { return num(n).toLocaleString(); }
  function money(n) { return '$' + num(n).toLocaleString(undefined, { maximumFractionDigits: 0 }); }
  function agoMin(iso) { return Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000)); }
  function agoText(iso) { var m = agoMin(iso); if (m < 60) return m + 'm ago'; var hh = Math.floor(m/60); if (hh<24) return hh + 'h ' + (m%60) + 'm ago'; return Math.floor(hh/24)+'d ago'; }
  function when(iso) { var d = new Date(iso); return d.toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
  function dateStr(iso) { return new Date(iso).toLocaleDateString([], { year:'numeric', month:'short', day:'numeric' }); }

  function toast(msg, kind) {

  /* ---------- escalation engine (Manual §6/§7) ---------- */
  function escLevel(kind, elapsedMin) {
    var rules = DB.load().config.escalation[kind]; var lvl = 0;
    for (var i = 0; i < rules.length; i++) if (elapsedMin >= rules[i].min) lvl = i + 1;
    return { level: lvl, rules: rules };

  function escSummary(kind, startIso, status) {
    if (status === 'restored' || status === 'closed') return { level: 0, met: true, label: 'Resolved' };

  }

  /* ---------- loss engine (Manual §10) ---------- */
  function lossFor() {
    var s = DB.load(), r = s.rates, dtMin = 0, ng = 0, scrap = 0, affected = 0;
    s.breakdowns.forEach(function (b) { dtMin += num(b.downtimeMin); affected += num(b.affectedQty); });
    s.quality.forEach(function (q) { ng += num(q.confirmedNG); });
    s.production.forEach(function (p) { scrap += num(p.ng); });
    var dtCost = dtMin * r.downtimeCostPerMin;
    var ngCost = ng * r.scrapCostPerUnit;
    var scrapCost = scrap * r.scrapCostPerUnit;
    return { dtMin: dtMin, dtCost: dtCost, ng: ng, ngCost: ngCost, scrap: scrap, scrapCost: scrapCost, affected: affected, total: dtCost + ngCost + scrapCost };
  }

  function kpis() {
    var s = DB.load(); var plan = 0, good = 0, total = 0, ng = 0, dt = 0, planned = s.production.length * 480;

      quality: quality*100, availability: availability*100, performance: performance*100,

      '<div class="role-pick">' + picks + '</div>' +
      '<div id="loginHint" class="login-hint">👆 Tap a role above to continue</div>' +

      '<div id="previewWarn" class="preview-warn" hidden>⚠ If tapping does nothing, you are viewing this in a file <strong>preview</strong>. Open the file in a real browser (Safari/Chrome): Download it, then Files ▸ tap the file ▸ <strong>Open in Browser</strong>.</div>' +
      '<p class="muted" style="font-size:.72rem;margin-top:14px">Prototype persists to this browser only (localStorage). No live database is connected — configure one later in Admin ▸ Data Backend.</p>' +
      '</div></div>';
    var sel = null;
    // Show the "preview" hint if no tap has registered a few seconds after load.
    var tapped = false;
    setTimeout(function () { var w = el('previewWarn'); if (w && !tapped) w.hidden = false; }, 4000);

    function pick(b) {

      var hint = el('loginHint'); if (hint) hint.textContent = '✓ ' + DB.ROLES[sel].name + ' selected — tap the button below';

    function badgeFor(m) {
      if (m==='breakdown' && c.openBd) return '<span class="chip escalated badge">'+c.openBd+'</span>';
      if (m==='quality' && c.openQa) return '<span class="chip open badge">'+c.openQa+'</span>';
      if ((m==='actions') && c.overdue) return '<span class="chip overdue badge">'+c.overdue+'</span>';
      if (m==='exceptions' && (c.escBd+c.overdue)) return '<span class="chip escalated badge">'+(c.escBd+c.overdue)+'</span>';
      if (m==='escalations' && c.escBd) return '<span class="chip escalated badge">'+c.escBd+'</span>';
      return '';
    }
    var nav = menus.map(function (m) {
      var meta = MENU_META[m];
      return '<button class="nav-item' + (m===route?' active':'') + '" data-route="' + m + '"><span class="ic">'+meta.ic+'</span>' + esc(meta.label) + badgeFor(m) + '</button>';
    }).join('');
    // mobile tab bar: pick up to 4 primary + a role-scoped "＋ Record" entry action.
    var tabMenus = menus.slice(0, 4);
    var tabs = tabMenus.map(function (m) { var meta = MENU_META[m]; return '<button data-route="'+m+'" class="'+(m===route?'active':'')+'"><span class="ic">'+meta.ic+'</span>'+esc(meta.label)+'</button>'; }).join('');
    // Entry roles get a prominent center "+ Record" button that opens their primary data-entry form.
    // Management roles (Plant/Division Head, CEO) get navigation only — no data entry (Manual §5).
    var rec = recordEntryFor(S.role);
    var andonTab = rec ? '<button data-record="1" class="record-tab"><span class="ic">＋</span>'+esc(rec.label)+'</button>'
      : (menus.indexOf('calculators')>=0 ? '<button data-route="calculators" class="'+(route==='calculators'?'active':'')+'"><span class="ic">🧮</span>Calc</button>' : '');

    App.innerHTML =
      '<div class="app-shell">' +
        '<header class="topbar">' +
          '<div class="brand"><span class="dot"></span> FactoryAI2U</div>' +
          '<div class="spacer"></div>' +
          '<span class="role-chip">' + esc(u.name) + ' · ' + esc(DB.ROLES[S.role].name) + '</span>' +
          '<button class="icon-btn" id="logoutBtn" title="Sign out">⏻</button>' +
        '</header>' +
        '<div class="layout">' +
          '<aside class="sidebar"><div class="nav-group"><div class="label">' + esc(DB.ROLES[S.role].philosophy) + '</div>' + nav + '</div>' +
            '<div class="nav-group"><div class="label">Session</div><button class="nav-item" id="resetBtn"><span class="ic">♻️</span>Reset demo data</button></div>' +
          '</aside>' +
          '<main class="content" id="view"></main>' +
        '</div>' +
        '<nav class="tabbar">' + tabs + andonTab + '</nav>' +
      '</div>';

    App.querySelectorAll('[data-route]').forEach(function (b) { b.onclick = function () { go(b.dataset.route); }; });
    App.querySelectorAll('[data-record]').forEach(function (b) { b.onclick = function () { var rec = recordEntryFor(S.role); if (rec) rec.open(); }; });
    el('logoutBtn').onclick = function () { S = null; try { sessionStorage.removeItem('factoryai2u.session'); } catch(e){} renderLogin(); };
    el('resetBtn').onclick = function () { if (confirm('Reset all demo data to seed?')) { DB.reset(); toast('Demo data reset.'); go('dashboard'); } };
    renderView();
  }

  function go(r) { route = r; drill = null; renderApp(); window.scrollTo(0,0); }
  function refresh() { renderApp(); }

  /* Primary data-entry action per entry role (Manual §5: management roles get none). */
  function recordEntryFor(role) {
    if (role === 'operator')    return { label: 'Record', open: productionForm };
    if (role === 'supervisor')  return { label: 'Andon',  open: breakdownForm };
    if (role === 'maintenance') return { label: 'Andon',  open: breakdownForm };

    return null; // management + admin: navigation only
  }

  /* ---------- VIEW ROUTER ---------- */
  function renderView() {

    var fn = ({
      dashboard: viewDashboard, production: viewProduction, breakdown: viewBreakdown, quality: viewQuality,
      escalations: viewEscalations, exceptions: viewExceptions, loss: viewLoss, drilldown: viewDrilldown,
      actions: viewActions, rca: viewActions, myitems: viewMyItems, calculators: viewCalculators,
      admin: viewAdmin, audit: viewAudit
    })[route] || viewDashboard;

  function pageHead(title, sub, actions) {
    return '<div class="page-head"><div class="titles"><h1>' + esc(title) + '</h1><p>' + esc(sub) + '</p></div>' + (actions?'<div class="actions">'+actions+'</div>':'') + '</div>';

  function recentEventsPanel() {
    var s = DB.load();
    var items = [];
    s.breakdowns.forEach(function (b){ items.push({ t:new Date(b.start).getTime(), kind:'bd', o:b }); });
    s.quality.forEach(function (q){ items.push({ t:new Date(q.ts).getTime(), kind:'qa', o:q }); });
    items.sort(function(a,b){ return b.t-a.t; });
    items = items.slice(0, 6);
    var rows = items.map(function (it) {
      if (it.kind==='bd') { var b=it.o;
        return '<div class="list-row" data-open-bd="'+b.id+'"><div class="lr-main"><div class="t">🚨 '+esc(DB.name('machine',b.machine))+' · '+esc(b.category)+'</div><div class="s">'+esc(b.notes)+' · '+agoText(b.start)+'</div></div><div class="lr-side"><span class="chip '+b.status+'">'+b.status+'</span><small>'+b.downtimeMin+'m DT</small></div></div>';

    var escList = DB.load().config.escalation.breakdown.map(function (r, i) {
      var reached = (b.status!=='restored'&&b.status!=='closed') && agoMin(b.start) >= r.min;

      '<dl class="kv">' +
        row('Machine', DB.name('machine',b.machine)) + row('Line', DB.name('line',b.line)) +

        row('Category', b.category + ' / ' + b.symptom) + row('Running Mode', b.runningMode) +

  var QA_STATES = ['open','containment','rca','closed'];
  function openQuality(id) {
    var s = DB.load(); var q = DB.byId(s.quality, id); if (!q) return;
    var canWork = ['qa','supervisor'].indexOf(S.role) >= 0;
    var linkedActs = s.actions.filter(function (a){ return a.srcType==='quality' && a.srcId===id; });
    var steps = ['Detect','Contain','Investigate','RCA','Correct','Verify','Close'];
    var curIdx = ({open:0, containment:1, rca:3, closed:6})[q.status] || 0;

      '<dl class="kv">' +
        r('Product', DB.name('product',q.product)) + r('Line', DB.name('line',q.line)) +

      '<button class="btn ghost" id="qcx">Close</button>';

    if (el('qaAct')) el('qaAct').onclick = function () { closeModal(); actionForm('quality', id, q.machine); };
    function r(k,val){ return '<dt>'+esc(k)+'</dt><dd>'+val+'</dd>'; }
  }

  /* ---------- DRILL-DOWN (management) ---------- */
  function viewDrilldown(v) {
    var s = DB.load();
    drill = drill || { level: 'plant', id: null };
    var crumbs = drillCrumbs();
    var html = pageHead('Drill-Down', 'KPI / exception → Plant → Area → Line → Machine → Event → Cause → Action.') + crumbs;
    if (drill.level === 'plant') {
      html += grid(s.plants.map(function (p){ return dcard(p.name, machinesInPlant(p.id).length + ' machines · '+eventsInPlant(p.id)+' events', function(){ drill={level:'machine', id:p.id}; renderView(); }); }));
    } else if (drill.level === 'machine') {
      var ms = machinesInPlant(drill.id);
      html += grid(ms.map(function (m){ var ev=s.breakdowns.filter(function(b){return b.machine===m.id;}).length; return dcard(m.name, m.type+' · '+ev+' breakdowns', function(){ drill={level:'events', id:m.id, plant:drill.id}; renderView(); }); }));
    } else if (drill.level === 'events') {
      var bds = s.breakdowns.filter(function(b){return b.machine===drill.id;});
      var qas = s.quality.filter(function(q){return q.machine===drill.id;});
      html += '<div class="section-title"><h2>Events on '+esc(DB.name('machine',drill.id))+'</h2><div class="line"></div></div><div class="list">' +
        bds.map(function(b){ return '<div class="list-row" data-bd="'+b.id+'"><div class="lr-main"><div class="t">🚨 '+esc(b.category)+'</div><div class="s">'+b.downtimeMin+'m · '+agoText(b.start)+'</div></div><div class="lr-side"><span class="chip '+b.status+'">'+b.status+'</span></div></div>'; }).join('') +
        qas.map(function(q){ return '<div class="list-row" data-qa="'+q.id+'"><div class="lr-main"><div class="t">🔎 '+esc(q.classification)+'</div><div class="s">NG '+q.confirmedNG+' · '+agoText(q.ts)+'</div></div><div class="lr-side">'+sevChip(q.severity)+'</div></div>'; }).join('') +
        ((bds.length+qas.length)?'':'<div class="empty">No events on this machine.</div>') + '</div>';
    }
    v.innerHTML = html;
    v.querySelectorAll('[data-crumb]').forEach(function(b){ b.onclick=function(){ var lv=b.dataset.crumb; if(lv==='plant') drill={level:'plant',id:null}; else if(lv==='machine') drill={level:'machine',id:drill.plant||drill.id}; renderView(); }; });
    v.querySelectorAll('.card.clickable[data-idx]').forEach(function(c){ c.onclick = dcbacks[num(c.dataset.idx)]; });
    v.querySelectorAll('[data-bd]').forEach(function(r){ r.onclick=function(){ openBreakdown(r.dataset.bd); }; });
    v.querySelectorAll('[data-qa]').forEach(function(r){ r.onclick=function(){ openQuality(r.dataset.qa); }; });

    function machinesInPlant(pid){ var lines = linesInPlant(pid); return s.machines.filter(function(m){ return lines.indexOf(m.line)>=0; }); }
    function linesInPlant(pid){ var areas=s.areas.filter(function(a){return a.plant===pid;}).map(function(a){return a.id;});
      var stages=s.stages.filter(function(st){return areas.indexOf(st.area)>=0;}).map(function(st){return st.id;});
      return s.lines.filter(function(l){return stages.indexOf(l.stage)>=0;}).map(function(l){return l.id;}); }
    function eventsInPlant(pid){ var ms=machinesInPlant(pid).map(function(m){return m.id;}); return s.breakdowns.filter(function(b){return ms.indexOf(b.machine)>=0;}).length + s.quality.filter(function(q){return ms.indexOf(q.machine)>=0;}).length; }
    var dcbacks = [];
    function dcard(title, sub, cb){ var i = dcbacks.length; dcbacks.push(cb); return '<div class="card clickable" data-idx="'+i+'"><div class="kpi"><div class="k-value" style="font-size:1.1rem">'+esc(title)+'</div><div class="k-foot"><span class="muted">'+esc(sub)+'</span></div><div class="k-foot" style="color:var(--primary)">Drill in →</div></div></div>'; }
    function grid(cards){ return '<div class="grid cols-3">'+cards.join('')+'</div>'; }
    function drillCrumbs(){
      var c = ['<button data-crumb="plant">Enterprise / Plants</button>'];
      if (drill.level==='machine'||drill.level==='events') c.push('<span class="sep">›</span><button data-crumb="machine">'+esc(DB.name('plant',drill.plant||drill.id))+'</button>');
      if (drill.level==='events') c.push('<span class="sep">›</span><span>'+esc(DB.name('machine',drill.id))+'</span>');
      return '<div class="breadcrumbs">'+c.join('')+'</div>';
    }
  }

  function openAction(id) {
    var s = DB.load(); var a = DB.byId(s.actions, id); if (!a) return;
    var can = ['qa','maintenance','supervisor'].indexOf(S.role)>=0;
    var body = '<dl class="kv">'+
      kv('Type', a.type)+kv('Description', a.desc)+kv('Owner', DB.name('user',a.owner))+
      kv('Machine', DB.name('machine',a.machine))+kv('Due', dateStr(a.due))+kv('Status','<span class="chip '+a.status+'">'+a.status+'</span>')+
      kv('Source', a.srcType?(a.srcType+' event'):'standalone')+kv('Created', when(a.created))+'</dl>';
    var foot = can ? '<button class="btn" id="reassign">Reassign</button><button class="btn" id="extend">Change Due</button>'+(a.status!=='closed'?'<button class="btn primary" id="closeAct">Close Action</button>':'') : '<button class="btn ghost" id="acx">Close</button>';
    modal('Action', body, foot);
    if (el('acx')) el('acx').onclick = closeModal;
    if (el('closeAct')) el('closeAct').onclick = function(){ a.status='closed'; DB.save(); DB.addAudit(S.userId,'CLOSE','Action closed: '+a.desc); closeModal(); toast('Action closed — loop complete.'); renderApp(); };
    if (el('reassign')) el('reassign').onclick = function(){ var opts=s.users.map(function(u){return u.id+':'+u.name;}).join(', '); var nv=prompt('Owner id ('+opts+')', a.owner); if(nv&&DB.byId(s.users,nv)){ a.owner=nv; DB.save(); closeModal(); openAction(id); } };
    if (el('extend')) el('extend').onclick = function(){ var nv=prompt('Due date (YYYY-MM-DD):', a.due.slice(0,10)); if(nv){ a.due=new Date(nv).toISOString(); a.status = new Date(nv)<new Date()?'overdue':'open'; DB.save(); closeModal(); openAction(id); renderApp(); } };
    function kv(k,val){ return '<dt>'+esc(k)+'</dt><dd>'+val+'</dd>'; }
  }
  function actionForm(srcType, srcId, machine) {
    var s = DB.load();
    var body = '<div class="form-grid">' +
      selRaw('a_type','Action Type', ['RCA / CA','Corrective','Preventive','Containment']) +
      selField('a_owner','Owner', s.users, function(u){return u.name+' ('+DB.ROLES[u.role].name+')';}) +
      selField('a_machine','Machine', s.machines) +
      inpField('a_due','Due Date','date', new Date(Date.now()+2*86400000).toISOString().slice(0,10)) +
      textField('a_desc','Action / Root Cause','Describe cause and corrective action...') +

    }
    el('crun').onclick = run;
    c.inputs.forEach(function(f){ el('ci_'+f.key).oninput = run; });

      wireAdmin(tab);
    }
    v.querySelectorAll('#admTabs button').forEach(function(bt){ bt.onclick=function(){ v.querySelectorAll('#admTabs button').forEach(function(x){x.classList.remove('active');}); bt.classList.add('active'); tab=bt.dataset.a; paint(); }; });
    paint();
  }

  function admDbBackend() {
    var cfg = DB.getDbConfig();
    return '<div class="card" style="border-left:4px solid var(--warn)">' +
      '<h3>🔌 Database Backend Connection <span class="chip plain">CORE V1.5</span></h3>' +
      '<p class="muted" style="font-size:.88rem">This prototype currently stores all data in <strong>this browser only</strong> (localStorage). No live database is registered yet. Enter your provider credentials here so an administrator can connect a shared backend (e.g. Supabase or Firebase) in a later phase (CORE V1.5+). ' +
      '<br><br>⚠ <strong>Security note (Manual §12):</strong> browser clients must never hold server-secret / service-role keys. Only public/anon keys belong here; privileged keys are configured server-side at connection time.</p>' +
      '<div class="form-grid">' +
        '<div class="field"><label>Provider</label><select id="db_provider"><option value="">— Not connected —</option><option value="Supabase"'+(cfg.provider==='Supabase'?' selected':'')+'>Supabase</option><option value="Firebase"'+(cfg.provider==='Firebase'?' selected':'')+'>Firebase</option><option value="Custom REST"'+(cfg.provider==='Custom REST'?' selected':'')+'>Custom REST API</option></select></div>' +
        '<div class="field"><label>Project / API URL</label><input id="db_url" placeholder="https://your-project.supabase.co" value="'+esc(cfg.url)+'"></div>' +
        '<div class="field"><label>Public / Anon Key</label><input id="db_anon" placeholder="public anon key" value="'+esc(cfg.anonKey)+'"></div>' +
        '<div class="field"><label>Database Name / Ref</label><input id="db_name" placeholder="factory_core" value="'+esc(cfg.dbName)+'"></div>' +
        '<div class="field"><label>Region</label><input id="db_region" placeholder="ap-southeast-1" value="'+esc(cfg.region)+'"></div>' +
        '<div class="field"><label>Service-role Handling</label><input id="db_srv" placeholder="Configured server-side only" value="'+esc(cfg.serviceRoleHint)+'"></div>' +
      '</div>' +
      '<div class="btn-row" style="margin-top:14px"><button class="btn primary" id="db_save">Save Credentials</button><button class="btn" id="db_test" disabled title="Backend connection is a later phase">Test Connection (later phase)</button><button class="btn ghost" id="db_clear">Clear</button></div>' +
      '<p class="muted" style="font-size:.78rem;margin-top:10px">Status: '+(cfg.savedAt? 'Credentials saved '+when(cfg.savedAt)+' · not yet connected':'No credentials saved')+'. Connecting the live backend is scoped for CORE V1.5+.</p>' +
    '</div>';
  }
  /* Master-table CRUD registry. Each entry describes a collection on state and its
     editable fields so add/edit/delete forms can be generated generically. */
  var MASTERS = {
    plants:   { title: 'Plants',   idPrefix: 'P',  cols: [['ID','id'],['Name','name'],['Division','division']],
                fields: [ f('name','Name','text'), fSel('division','Division','divisions') ] },
    lines:    { title: 'Lines',    idPrefix: 'L',  cols: [['ID','id'],['Name','name'],['Stage','stage']],
                fields: [ f('name','Name','text'), fSel('stage','Stage','stages') ] },
    machines: { title: 'Machines', idPrefix: 'M',  cols: [['ID','id'],['Name','name'],['Type','type'],['Line','line']],
                fields: [ f('name','Name','text'), f('type','Type','text'), fSel('line','Line','lines') ] },
    products: { title: 'Products', idPrefix: 'PR', cols: [['Part No','partNo'],['Part','part'],['Model','model'],['Customer','customer']],
                fields: [ f('partNo','Part No','text'), f('part','Part Name','text'), f('model','Model','text'), f('customer','Customer','text') ] },
    shifts:   { title: 'Shifts',   idPrefix: 'SH', cols: [['ID','id'],['Name','name'],['Start','start'],['End','end']],
                fields: [ f('name','Name','text'), f('start','Start (HH:MM)','text'), f('end','End (HH:MM)','text') ] }
  };
  function f(key, label, type)  { return { key: key, label: label, type: type }; }
  function fSel(key, label, ref){ return { key: key, label: label, ref: ref }; }

  function admMasters() {
    var s = DB.load();
    function tbl(key){
      var cfg = MASTERS[key]; var arr = s[key] || [];
      var head = cfg.cols.map(function(c){return '<th>'+esc(c[0])+'</th>';}).join('') + '<th></th>';
      var body = arr.map(function(o){
        return '<tr>'+cfg.cols.map(function(c){
          var val = o[c[1]]; if ((c[1]==='division'||c[1]==='stage'||c[1]==='line')) val = refName(c[1], o[c[1]]);
          return '<td>'+esc(val==null?'':val)+'</td>';
        }).join('') +
        '<td class="row-actions-cell"><div class="row-actions"><button class="btn ghost sm" data-medit="'+key+'" data-id="'+esc(o.id)+'">Edit</button><button class="btn ghost sm" data-mdel="'+key+'" data-id="'+esc(o.id)+'">Delete</button></div></td></tr>';
      }).join('');
      return '<div class="section-title"><h2>'+esc(cfg.title)+'</h2><div class="line"></div></div>' +
        '<div class="crud-bar"><button class="btn primary sm" data-madd="'+key+'">＋ Add '+esc(cfg.title.replace(/s$/,''))+'</button></div>' +
        '<div class="table-wrap"><table><thead><tr>'+head+'</tr></thead><tbody>'+(body||'<tr><td colspan="'+(cfg.cols.length+1)+'" class="empty">None yet.</td></tr>')+'</tbody></table></div>';
    }
    return '<p class="muted">Company structure and product masters — fully configurable without code (Manual §11). Add, edit and delete below; changes persist and are audited.</p>' +
      tbl('plants') + tbl('lines') + tbl('machines') + tbl('products') + tbl('shifts');
  }

  function refName(ref, id) {
    var s = DB.load();
    if (ref==='division'){ var d = DB.byId(s.org.divisions||[], id); return d?d.name:(id||'—'); }
    if (ref==='stage'){ var st = DB.byId(s.stages||[], id); return st?st.name:(id||'—'); }
    if (ref==='line'){ var l = DB.byId(s.lines||[], id); return l?l.name:(id||'—'); }
    return id;
  }

  function admPeople() {
    var s = DB.load();
    var rows = s.users.map(function(u){
      return '<tr><td>'+esc(u.name)+'</td><td>'+esc(DB.ROLES[u.role]?DB.ROLES[u.role].name:u.role)+'</td><td>'+esc(u.shift)+'</td><td>'+esc(u.scope)+'</td>' +
        '<td class="muted" style="white-space:normal;font-size:.8rem">'+(DB.MENUS[u.role]||[]).map(function(m){return MENU_META[m]?MENU_META[m].label:m;}).join(', ')+'</td>' +
        '<td class="row-actions-cell"><div class="row-actions"><button class="btn ghost sm" data-uedit="'+esc(u.id)+'">Edit</button><button class="btn ghost sm" data-udel="'+esc(u.id)+'">Delete</button></div></td></tr>';
    }).join('');
    return '<p class="muted">Users, roles, shifts and scope. Role → menu mapping is fixed by design (management roles never get data-entry menus, Manual §5). Add/edit/delete users below.</p>' +
      '<div class="crud-bar"><button class="btn primary sm" id="u_add">＋ Add User</button></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Shift</th><th>Scope</th><th>Accessible Menus</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="empty">No users.</td></tr>')+'</tbody></table></div>';
  }

  /* ---- Master add/edit form (generic) ---- */
  function masterForm(key, id) {
    var s = DB.load(); var cfg = MASTERS[key];
    var rec = id ? DB.byId(s[key], id) : null;
    var body = '<div class="form-grid">' + cfg.fields.map(function(fd){
      if (fd.ref) {
        var arr = s[fd.ref] || (fd.ref==='divisions'? (s.org.divisions||[]) : []);
        var opts = arr.map(function(x){ return '<option value="'+esc(x.id)+'"'+((rec&&rec[fd.key]===x.id)?' selected':'')+'>'+esc(x.name||x.id)+'</option>'; }).join('');
        return '<div class="field"><label>'+esc(fd.label)+'</label><select id="mf_'+fd.key+'"><option value="">—</option>'+opts+'</select></div>';
      }
      var v = rec ? (rec[fd.key]==null?'':rec[fd.key]) : '';
      return '<div class="field"><label>'+esc(fd.label)+'</label><input type="'+fd.type+'" id="mf_'+fd.key+'" value="'+esc(v)+'"></div>';
    }).join('') + '</div>';
    modal((id?'Edit ':'Add ')+cfg.title.replace(/s$/,''), body, '<button class="btn ghost" id="mf_c">Cancel</button><button class="btn primary" id="mf_s">Save</button>');
    el('mf_c').onclick = closeModal;
    el('mf_s').onclick = function(){
      var first = cfg.fields[0];
      var firstVal = el('mf_'+first.key).value.trim();
      if (!firstVal) { toast('“'+first.label+'” is required.', 'err'); return; }
      if (!rec) { rec = { id: nextMasterId(key, cfg.idPrefix) }; s[key].push(rec); }
      cfg.fields.forEach(function(fd){ rec[fd.key] = el('mf_'+fd.key).value; });
      DB.save();
      DB.addAudit(S.userId, id?'UPDATE':'CREATE', (id?'Updated ':'Added ')+cfg.title.replace(/s$/,'')+' '+(rec.name||rec.partNo||rec.id));
      closeModal(); toast(cfg.title.replace(/s$/,'')+' saved.'); admRepaint('Masters');
    };
  }
  function nextMasterId(key, prefix) {
    var arr = DB.load()[key] || []; var max = 0;
    arr.forEach(function(o){ var m = /(\d+)$/.exec(o.id||''); if (m) max = Math.max(max, num(m[1])); });
    return prefix + (max + 1);
  }
  function masterDelete(key, id) {
    var s = DB.load(); var cfg = MASTERS[key]; var o = DB.byId(s[key], id); if (!o) return;
    if (!confirm('Delete '+cfg.title.replace(/s$/,'')+' “'+(o.name||o.partNo||o.id)+'”? This cannot be undone.')) return;
    s[key] = s[key].filter(function(x){ return x.id !== id; });
    // keep top-level ref and org in sync
    if (s.org[key]) s.org[key] = s[key];
    DB.save(); DB.addAudit(S.userId, 'DELETE', 'Deleted '+cfg.title.replace(/s$/,'')+' '+(o.name||o.partNo||o.id));
    toast(cfg.title.replace(/s$/,'')+' deleted.'); admRepaint('Masters');
  }

  /* ---- User add/edit form ---- */
  function userForm(id) {
    var s = DB.load(); var u = id ? DB.byId(s.users, id) : null;
    var roleOpts = Object.keys(DB.ROLES).map(function(r){ return '<option value="'+r+'"'+((u&&u.role===r)?' selected':'')+'>'+esc(DB.ROLES[r].name)+'</option>'; }).join('');
    var shiftOpts = (s.shifts||[]).map(function(sh){ return '<option value="'+esc(sh.id)+'"'+((u&&u.shift===sh.id)?' selected':'')+'>'+esc(sh.name)+'</option>'; }).join('') + '<option value="-"'+((u&&u.shift==='-')?' selected':'')+'>— (management)</option>';
    var body = '<div class="form-grid">' +
      '<div class="field"><label>Name</label><input id="uf_name" value="'+esc(u?u.name:'')+'"></div>' +
      '<div class="field"><label>Role</label><select id="uf_role">'+roleOpts+'</select></div>' +
      '<div class="field"><label>Shift</label><select id="uf_shift">'+shiftOpts+'</select></div>' +
      '<div class="field"><label>Scope (e.g. P1 / D1 / ALL)</label><input id="uf_scope" value="'+esc(u?u.scope:'P1')+'"></div>' +
      '</div><p class="muted" style="font-size:.8rem">The menus a role can access are fixed by design and cannot be edited here (Manual §5).</p>';
    modal((id?'Edit User':'Add User'), body, '<button class="btn ghost" id="uf_c">Cancel</button><button class="btn primary" id="uf_s">Save</button>');
    el('uf_c').onclick = closeModal;
    el('uf_s').onclick = function(){
      var nm = el('uf_name').value.trim(); if (!nm){ toast('Name is required.','err'); return; }
      if (!u){ u = { id: nextUserId() }; s.users.push(u); }
      u.name = nm; u.role = el('uf_role').value; u.shift = el('uf_shift').value; u.scope = el('uf_scope').value.trim()||'P1';
      DB.save(); DB.addAudit(S.userId, id?'UPDATE':'CREATE', (id?'Updated ':'Added ')+'user '+u.name+' ('+DB.ROLES[u.role].name+')');
      closeModal(); toast('User saved.'); admRepaint('People & Roles');
    };
  }
  function nextUserId(){ var arr = DB.load().users; var max=0; arr.forEach(function(o){ var m=/(\d+)$/.exec(o.id||''); if(m) max=Math.max(max,num(m[1])); }); return 'u'+(max+1); }
  function userDelete(id){
    var s = DB.load(); var u = DB.byId(s.users, id); if (!u) return;
    if (u.id === S.userId){ toast('You cannot delete the account you are signed in as.','err'); return; }
    if (!confirm('Delete user “'+u.name+'”?')) return;
    s.users = s.users.filter(function(x){ return x.id !== id; });
    DB.save(); DB.addAudit(S.userId, 'DELETE', 'Deleted user '+u.name);
    toast('User deleted.'); admRepaint('People & Roles');
  }

  /* Repaint a specific admin tab in place (used by CRUD handlers). */
  function admRepaint(tab) {
    var b = el('admBody'); if (!b) { renderApp(); return; }
    if (tab==='Masters') b.innerHTML = admMasters();
    else if (tab==='People & Roles') b.innerHTML = admPeople();
    else if (tab==='Data Backend') b.innerHTML = admDbBackend();
    else if (tab==='Escalation') b.innerHTML = admEscalation();
    else b.innerHTML = admKpiRates();
    wireAdmin(tab);
  }
  function admEscalation() {
    var esc_ = DB.load().config.escalation;
    function tbl(kind, arr){ return '<div class="section-title"><h2>'+(kind==='breakdown'?'Breakdown / Andon':'Quality')+' Escalation</h2><div class="line"></div></div><div class="table-wrap"><table><thead><tr><th>Threshold (min)</th><th>Notify</th></tr></thead><tbody>'+arr.map(function(r,i){return '<tr><td><input type="number" data-esc="'+kind+'" data-i="'+i+'" data-f="min" value="'+r.min+'" style="min-height:38px"></td><td><input data-esc="'+kind+'" data-i="'+i+'" data-f="to" value="'+esc(r.to)+'" style="min-height:38px"></td></tr>';}).join('')+'</tbody></table></div>'; }
    return '<p class="muted">Threshold minutes and recipients are configurable (Manual §6/§7). Changes are audited.</p>'+tbl('breakdown', esc_.breakdown)+tbl('quality', esc_.quality)+'<div class="btn-row" style="margin-top:14px"><button class="btn primary" id="esc_save">Save Escalation Rules</button></div>';
  }
  function admKpiRates() {
    var s = DB.load(); var k = s.kpiTargets; var r = s.rates;
    return '<div class="section-title"><h2>KPI Targets</h2><div class="line"></div></div><div class="form-grid">' +
      inpField('k_oee','OEE Target (%)','number',k.oee)+inpField('k_quality','Quality Target (%)','number',k.quality)+inpField('k_fpy','FPY Target (%)','number',k.fpy)+inpField('k_avail','Availability Target (%)','number',k.availability)+
      '</div>' +
      '<div class="section-title"><h2>Standard Rates <span class="chip plain">demo only — not real costing</span></h2><div class="line"></div></div><div class="form-grid">' +
      inpField('r_dt','Downtime Cost ($/min)','number',r.downtimeCostPerMin)+inpField('r_scrap','Scrap / NG Cost ($/pc)','number',r.scrapCostPerUnit)+inpField('r_rework','Rework Cost ($/pc)','number',r.ngReworkPerUnit)+
      '</div><div class="btn-row" style="margin-top:14px"><button class="btn primary" id="kpi_save">Save KPI & Rates</button></div>';
  }
  function wireAdmin(tab) {
    if (tab==='Masters') {
      document.querySelectorAll('[data-madd]').forEach(function(b){ b.onclick=function(){ masterForm(b.dataset.madd, null); }; });
      document.querySelectorAll('[data-medit]').forEach(function(b){ b.onclick=function(){ masterForm(b.dataset.medit, b.dataset.id); }; });
      document.querySelectorAll('[data-mdel]').forEach(function(b){ b.onclick=function(){ masterDelete(b.dataset.mdel, b.dataset.id); }; });
      return;
    }
    if (tab==='People & Roles') {
      if (el('u_add')) el('u_add').onclick = function(){ userForm(null); };
      document.querySelectorAll('[data-uedit]').forEach(function(b){ b.onclick=function(){ userForm(b.dataset.uedit); }; });
      document.querySelectorAll('[data-udel]').forEach(function(b){ b.onclick=function(){ userDelete(b.dataset.udel); }; });
      return;
    }
    if (tab==='Data Backend') {
      el('db_save').onclick = function(){ var cfg = DB.saveDbConfig({ provider:el('db_provider').value, url:el('db_url').value, anonKey:el('db_anon').value, dbName:el('db_name').value, region:el('db_region').value, serviceRoleHint:el('db_srv').value }); DB.addAudit(S.userId,'CONFIG','Database credentials saved ('+(cfg.provider||'none')+')'); toast('Credentials saved locally. Live connection is a later phase.'); el('admBody').innerHTML = admDbBackend(); wireAdmin('Data Backend'); };
      el('db_clear').onclick = function(){ DB.saveDbConfig({provider:'',url:'',anonKey:'',dbName:'',region:'',serviceRoleHint:''}); toast('Credentials cleared.'); el('admBody').innerHTML = admDbBackend(); wireAdmin('Data Backend'); };
    } else if (tab==='Escalation') {
      el('esc_save').onclick = function(){ var s=DB.load(); document.querySelectorAll('[data-esc]').forEach(function(inp){ var kind=inp.dataset.esc, i=num(inp.dataset.i), f=inp.dataset.f; if(f==='min') s.config.escalation[kind][i].min=num(inp.value); else s.config.escalation[kind][i].to=inp.value; }); DB.save(); DB.addAudit(S.userId,'CONFIG','Escalation rules updated'); toast('Escalation rules saved.'); };
    } else if (tab==='KPI & Rates') {
      el('kpi_save').onclick = function(){ var s=DB.load(); s.kpiTargets.oee=num(el('k_oee').value); s.kpiTargets.quality=num(el('k_quality').value); s.kpiTargets.fpy=num(el('k_fpy').value); s.kpiTargets.availability=num(el('k_avail').value); s.rates.downtimeCostPerMin=num(el('r_dt').value); s.rates.scrapCostPerUnit=num(el('r_scrap').value); s.rates.ngReworkPerUnit=num(el('r_rework').value); DB.save(); DB.addAudit(S.userId,'CONFIG','KPI targets & standard rates updated'); toast('KPI targets & rates saved.'); };
    }
  }

  /* ---------- AUDIT ---------- */
  function viewAudit(v) {
    var s = DB.load();
    var rows = s.audit.map(function(l){ return '<tr><td>'+when(l.ts)+'</td><td>'+esc(DB.name('user',l.user))+'</td><td><span class="chip plain">'+esc(l.action)+'</span></td><td style="white-space:normal">'+esc(l.detail)+'</td></tr>'; }).join('');
    v.innerHTML = pageHead('Audit Log', 'Who · When · What. No silent deletion; significant activity is traceable (Manual §17).') +
      '<div class="table-wrap"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="empty">No audit entries.</td></tr>')+'</tbody></table></div>';
  }

  /* ---------- shared form field builders ---------- */
  function selField(id, label, arr, labeller) {
    var opts = arr.map(function(x){ return '<option value="'+esc(x.id)+'">'+esc(labeller?labeller(x):x.name)+'</option>'; }).join('');
    return '<div class="field"><label>'+esc(label)+' <span class="req">*</span></label><select id="'+id+'">'+opts+'</select></div>';
  }
  function selRaw(id, label, arr) {
    return '<div class="field"><label>'+esc(label)+' <span class="req">*</span></label><select id="'+id+'">'+arr.map(function(x){return '<option>'+esc(x)+'</option>';}).join('')+'</select></div>';
  }
  function inpField(id, label, type, def) { return '<div class="field"><label>'+esc(label)+'</label><input type="'+type+'" id="'+id+'" value="'+esc(def)+'"></div>'; }
  function textField(id, label, ph) { return '<div class="field full"><label>'+esc(label)+'</label><textarea id="'+id+'" placeholder="'+esc(ph)+'"></textarea></div>'; }
  function sevChip(sev) { var m={Critical:'crit',Major:'major',Minor:'minor',Observation:'plain'}; return '<span class="chip '+(m[sev]||'plain')+'">'+esc(sev)+'</span>'; }

  /* ---------- network status ---------- */
  function netStatus() {
    var b = el('net-banner');
    if (!navigator.onLine) { b.hidden = false; b.className = 'net-banner offline'; b.textContent = '⚡ Offline — data cached locally, transactions queue for sync (CORE V1.5+).'; }
    else { b.hidden = true; }
  }
  window.addEventListener('online', netStatus); window.addEventListener('offline', netStatus);

  /* ---------- boot ---------- */
  DB.load();
  try { var sv = sessionStorage.getItem('factoryai2u.session'); if (sv) S = JSON.parse(sv); } catch (e) {}
  if (S && DB.byId(DB.load().users, S.userId)) renderApp(); else renderLogin();
  netStatus();
})();

  </script>
  <script>
  (function () {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol === 'file:') return;
    var swCode = [
      "var CACHE='factoryai2u-single-v1';",
      "self.addEventListener('install',function(e){self.skipWaiting();e.waitUntil(caches.open(CACHE).then(function(c){return c.add(location.href.replace(/#.*$/,'')).catch(function(){});}));});",
      "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});",
      "self.addEventListener('fetch',function(e){if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(function(r){return r||fetch(e.request).then(function(res){var copy=res.clone();caches.open(CACHE).then(function(c){try{c.put(e.request,copy);}catch(x){}});return res;}).catch(function(){return caches.match(location.href.replace(/#.*$/,''));});}));});"
    ].join('\n');
    try { var blob=new Blob([swCode],{type:'text/javascript'}); navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){}); } catch (e) {}
  })();
  </script>
