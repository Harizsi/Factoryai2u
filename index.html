function validation(){const tests=runTests(),passed=tests.filter(x=>x.pass).length;return header('Validation & test centre','Deterministic checks continuously test the current browser-local dataset.',`<button class="btn primary" data-action="runTests">Run checks</button>`)+`<div class="test-summary"><div class="test-stat"><span class="muted">Checks passed</span><b>${passed}/${tests.length}</b></div><div class="test-stat"><span class="muted">Production records</span><b>${state.production.length}</b></div><div class="test-stat"><span class="muted">Exceptions / actions</span><b>${state.breakdowns.length+state.quality.length} / ${state.actions.length}</b></div></div><div class="test-grid">${tests.map(t=>`<article class="test-card"><span class="badge ${t.pass?'passed':'failed'}">${t.pass?'PASS':'FAIL'}</span> <strong>${esc(t.name)}</strong><p>${esc(t.detail)}</p></article>`).join('')}</div>${limitations()}`}
function settings(){return header('Prototype system','Storage, install readiness, export and reset.',`<button class="btn primary" id="installBtn">Install app</button>`)+`<div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Local prototype controls</h2></div><div class="panel-body"><div class="detail-grid"><div class="detail"><span>Storage</span><strong>Browser localStorage</strong></div><div class="detail"><span>Backend</span><strong>Not connected</strong></div><div class="detail"><span>Shared realtime</span><strong>Not available</strong></div><div class="detail"><span>Notifications</span><strong>In-app demo only</strong></div><div class="detail"><span>Seed span</span><strong>${START} — ${TODAY}</strong></div><div class="detail"><span>Install mode</span><strong>${standalone()?'Standalone':'Browser'}</strong></div></div><div class="cluster"><button class="btn" data-action="exportJSON">Export JSON</button><button class="btn danger" data-action="reset">Reset deterministic data</button></div></div></section><section class="panel"><div class="panel-head"><h2>Honest PWA boundary</h2></div><div class="panel-body"><p class="muted">This delivery is one self-contained HTML file with embedded manifest, styles and scripts. A separate service worker cannot be embedded as a standards-compliant persistent worker, so guaranteed offline relaunch and background sync are not claimed.</p><p class="muted">Use the browser’s Add to Home Screen option when available. Clearing site data removes local edits.</p></div></section></div>${limitations()}`}
function render(){if(!roleMenus[state.role].includes(state.view))state.view='dashboard';const map={dashboard,events,production:productionForm,breakdown:breakdownForm,quality:qualityForm,actions,audit,admin,validation,settings};viewRoot.innerHTML=`<div class="view">${map[state.view]()}</div>`;bindView()}
function findRecord(id){return state.breakdowns.find(x=>x.id===id)||state.quality.find(x=>x.id===id)||state.production.find(x=>x.id===id)}function recordType(id){return id.startsWith('BD')?'Breakdown':id.startsWith('QA')?'Quality':'Production'}function openRecord(id){const x=findRecord(id);if(!x)return;const type=recordType(id),related=state.actions.filter(a=>a.source===id),rca=state.rcas.find(r=>r.source===id),fields=Object.entries(x).filter(([k])=>!['notes','description'].includes(k)).slice(0,18);modal(`${type} · ${id}`,`<span class="badge ${x.severity==='Critical'?'critical':x.status==='Closed'?'closed':'open'}">${esc(x.status||'Recorded')}</span><div class="detail-grid">${fields.map(([k,v])=>`<div class="detail"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div>${x.notes||x.description?`<div class="info-block"><h3>Source observation</h3><p>${esc(x.notes||x.description)}</p></div>`:''}<div class="trace"><div class="eyebrow">Drill-down trace</div><div class="trace-step"><b>01</b><span>One source event: ${id}</span></div><div class="trace-step"><b>02</b><span>${rca?`RCA ${rca.id}: ${esc(rca.cause)}`:'No RCA linked yet'}</span></div><div class="trace-step"><b>03</b><span>${related.length} linked action(s), each with owner and due date</span></div><div class="trace-step"><b>04</b><span>Reused by dashboard, loss, report and audit views</span></div></div><div class="cluster"><button class="btn primary" data-modal-action="action" data-source="${id}">Add linked action</button>${type!=='Production'?`<button class="btn" data-modal-action="advance" data-source="${id}">Advance status</button>`:''}</div>`)}
function openAction(id){const a=state.actions.find(x=>x.id===id);if(!a)return;modal(`Action · ${id}`,`<div class="detail-grid"><div class="detail"><span>Source</span><strong>${a.source}</strong></div><div class="detail"><span>RCA</span><strong>${a.rcaId}</strong></div><div class="detail"><span>Owner</span><strong>${esc(a.owner)}</strong></div><div class="detail"><span>Due</span><strong>${a.due}</strong></div><div class="detail"><span>Status</span><strong>${a.status}</strong></div><div class="detail"><span>Effectiveness</span><strong>${a.effectiveness}</strong></div></div><div class="info-block"><h3>Action</h3><p>${esc(a.title)}</p></div><div class="cluster"><button class="btn primary" data-modal-action="advanceAction" data-source="${id}">Advance status</button><button class="btn" data-id="${a.source}">Open source</button></div>`)}
function modal(title,body,wide=false){modalLayer.innerHTML=`<div class="modal ${wide?'wide':''}"><div class="modal-head"><div><div class="eyebrow">FactoryAI2U</div><h2 id="modalTitle">${esc(title)}</h2></div><button class="close" data-close aria-label="Close">×</button></div><div class="modal-body">${body}</div></div>`;modalLayer.classList.remove('hidden');modalLayer.querySelector('[data-close]').focus()}function closeModal(){modalLayer.classList.add('hidden')}
function masterEditor(index=null){const items=state.masters[activeMaster],editing=Number.isInteger(index),old=editing?items[index]:'';modal(`${editing?'Edit':'Add'} ${masterMeta[activeMaster]}`,`<form id="masterForm"><div class="field"><label>Controlled value</label><input name="value" value="${esc(old)}" maxlength="120" required></div><div id="masterError" class="form-error"></div><div class="form-nav"><button type="button" class="btn" data-close>Back</button><button class="btn primary" type="submit">${editing?'Save edit':'Add value'}</button></div></form>`);masterForm.onsubmit=e=>{e.preventDefault();const value=new FormData(e.target).get('value').trim(),err=document.getElementById('masterError');if(!value)return err.textContent='Value is required.';if(items.some((x,i)=>i!==index&&x.toLowerCase()===value.toLowerCase()))return err.textContent='Value must be unique.';if(editing){const mapping={plants:'plant',areas:'area',stages:'stage',lines:'line',machines:'machine',parts:'part',models:'model',customers:'customer',shifts:'shift',breakdownCategories:'category',symptoms:'symptom',qualityClasses:'classification',severities:'severity'},field=mapping[activeMaster];items[index]=value;if(field)[...state.production,...state.breakdowns,...state.quality].forEach(r=>{if(r[field]===old)r[field]=value});if(activeMaster==='users'){[...state.production,...state.breakdowns,...state.quality].forEach(r=>{if(r.user===old)r.user=value;if(r.operator===old)r.operator=value});state.actions.forEach(a=>{if(a.owner===old)a.owner=value})}log('Master data edited',`${old} changed to ${value}; references updated.`,activeMaster)}else{items.push(value);log('Master data added',`${value} added to ${masterMeta[activeMaster]}.`,activeMaster)}closeModal();render();toast(`${value} saved and audited`)}}
function deleteMaster(index){const value=state.masters[activeMaster][index];if(referenced(activeMaster,value))return toast('Cannot delete a value referenced by source records.',true);modal(`Delete ${value}?`,`<div class="form-error">This destructive change is permanent within the current local dataset.</div><div class="form-nav"><button class="btn" data-close>Back</button><button class="btn danger" data-confirm-master-delete="${index}">Confirm delete</button></div>`)}function confirmDeleteMaster(index){const items=state.masters[activeMaster],value=items[index];if(items.length<=1)return toast('At least one value must remain.',true);if(referenced(activeMaster,value))return toast('Referenced values are protected.',true);items.splice(index,1);log('Master data deleted',`${value} deleted from ${masterMeta[activeMaster]}.`,activeMaster);closeModal();render();toast('Value deleted and audited')}
function editRecord(id){const t=recordType(id);if(!canEdit(t))return toast('Your role cannot edit this transaction.',true);state.editing={id,type:t.toLowerCase()};state.formStep=0;goto(t.toLowerCase())}function deleteRecord(id){const t=recordType(id);if(!canDelete(t))return toast('Your role cannot delete this transaction.',true);const deps=state.actions.filter(a=>a.source===id);modal(`Delete ${id}?`,`<div class="form-error">This removes the source event and ${deps.length} linked action(s)/RCA records. The deletion itself remains in the audit trail.</div><div class="form-nav"><button class="btn" data-close>Back</button><button class="btn danger" data-confirm-record-delete="${id}">Confirm delete</button></div>`)}function confirmDeleteRecord(id){const t=recordType(id),key=t==='Production'?'production':t==='Breakdown'?'breakdowns':'quality';state[key]=state[key].filter(x=>x.id!==id);state.actions=state.actions.filter(x=>x.source!==id);state.rcas=state.rcas.filter(x=>x.source!==id);log('Source transaction deleted',`${id} and dependent improvement records deleted after confirmation.`,id);closeModal();render();toast(`${id} deleted and audited`)}
function validateStep(form,step){const inputs=[...form.querySelector(`[data-step="${step}"]`).querySelectorAll('input,select,textarea')];for(const x of inputs)if(!x.checkValidity()){x.reportValidity();return false}return true}function submitEntry(e){e.preventDefault();const type=e.target.dataset.type,f=Object.fromEntries(new FormData(e.target)),editing=state.editing&&state.editing.type===type?findRecord(state.editing.id):null,nums=['planned','actual','good','ng','output','affected','suspected'];nums.forEach(k=>{if(k in f)f[k]=+f[k]});if(type==='production'&&f.good+f.ng!==f.actual)return document.getElementById('entryError').textContent='Good + NG must equal actual quantity.';if(type==='quality'&&f.ng>f.suspected)return document.getElementById('entryError').textContent='Confirmed NG cannot exceed suspected quantity.';let arr=state[type==='production'?'production':type==='breakdown'?'breakdowns':'quality'],r;if(editing){Object.assign(editing,f);r=editing;log('Source transaction edited',`${r.id} updated without changing its source identity.`,r.id)}else if(type==='production'){r={id:nextId('PRD',arr),...f,user:state.context.operator,sync:'Pending sync'};arr.unshift(r);log('Production source created',`${r.id} recorded once.`,r.id)}else if(type==='breakdown'){r={id:nextId('BD',arr),...f,status:'Open',severity:['Major','Emergency Stop'].includes(f.category)?'Critical':'Major',owner:'Morgan Chen',durationMin:0,loss:0,sync:'Pending sync',escalationLevel:'Supervisor'};arr.unshift(r);log('Breakdown source created',`${r.id} recorded once; local Andon clock started.`,r.id)}else{r={id:nextId('QA',arr),...f,status:'Detected',owner:'Priya Shah',loss:f.ng*68,sync:'Pending sync',escalationLevel:f.severity==='Critical'?'QA Head':'Supervisor'};arr.unshift(r);log('Quality source created',`${r.id} recorded once; containment required.`,r.id)}state.editing=null;state.formStep=0;delete entryDraft[type];save();toast(`${r.id} saved locally and audited`);goto('events')}
function actionForm(source=''){const sources=[...state.breakdowns,...state.quality];modal('Add corrective action',`<form id="actionForm"><div class="form-grid">${selectField('source','Source event',sources.map(x=>x.id),source||sources[0].id)}${selectField('owner','Owner',state.masters.users,'Priya Shah')}${inputField('due','Due date','date',TODAY)}<div class="field full"><label>Action</label><textarea name="title" required></textarea></div></div><div class="form-nav"><button type="button" class="btn" data-close>Back</button><button class="btn primary" type="submit">Add action</button></div></form>`);document.getElementById('actionForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),r={id:nextId('ACT',state.actions),...f,rcaId:state.rcas.find(x=>x.source===f.source)?.id||'',status:'Open',closedAt:'',effectiveness:'Pending',priority:findRecord(f.source).severity||'Major'};state.actions.unshift(r);log('Action created',`${r.id} linked to ${r.source}, owner ${r.owner}, due ${r.due}.`,r.id);closeModal();render();toast('Action added and audited')}}
function advance(id){const x=findRecord(id),flows=id.startsWith('BD')?['Open','Responding','Restored','Closed']:['Detected','Containment','Investigation','RCA','Verification','Closed'];x.status=flows[Math.min(flows.length-1,Math.max(0,flows.indexOf(x.status)+1))];log('Event status changed',`${id} advanced to ${x.status}.`,id);openRecord(id);toast(`${id} → ${x.status}`)}function advanceAction(id){const a=state.actions.find(x=>x.id===id),flow=['Open','In progress','Verification','Closed'];a.status=flow[Math.min(3,Math.max(0,flow.indexOf(a.status)+1))];a.effectiveness=a.status==='Closed'?'Effective':a.status==='Verification'?'Monitoring':'Pending';a.closedAt=a.status==='Closed'?TODAY:'';log('Action status changed',`${id} advanced to ${a.status}.`,id);openAction(id);toast(`${id} → ${a.status}`)}

function group(items,key,valueFn=()=>1){const map={};items.forEach(x=>{const k=typeof key==='function'?key(x):(x[key]||'Unclassified');map[k]=(map[k]||0)+valueFn(x)});return Object.entries(map).map(([label,value])=>({label,value}))}function dateSeries(fn){const out=[];for(let d=state.filters.from;d<=state.filters.to;d=dateAdd(d,1))out.push({label:d,value:fn(d)});return out}function fmtValue(v,unit){if(unit==='$')return money(v);if(unit==='%')return Number(v).toFixed(1)+'%';return Math.round(v).toLocaleString()+(unit?' '+unit:'')}function kpiMap(m){const all=[...m.production,...m.breakdowns,...m.quality],closedQ=m.quality.filter(x=>x.status==='Closed').length,closedB=m.breakdowns.filter(x=>x.status==='Closed'||x.status==='Restored').length,audited=all.filter(r=>state.audit.some(a=>a.entityId===r.id)).length;return{shiftOutput:['Actual output',m.actual,'pcs','Source production actual'],goodQty:['Good quantity',m.good,'pcs','Accepted source output'],ngQty:['Confirmed NG',m.ng,'pcs','Production source NG'],sourceEntries:['Source entries',all.length,'','Production + breakdown + quality'],achievement:['Achievement',m.achievement,'%','Actual ÷ planned'],openExceptions:['Open exceptions',m.open.length,'','Not closed or restored'],downtime:['Downtime',m.downtime,'min','Recorded breakdown minutes'],overdue:['Overdue actions',m.overdue,'','Open and due before today'],qualityAlerts:['Quality alerts',m.quality.length,'','Quality source incidents'],confirmedNG:['Confirmed NG',m.quality.reduce((s,x)=>s+x.ng,0),'pcs','Confirmed from quality alerts'],qualityRate:['Quality rate',m.qualityRate,'%','Good ÷ actual'],qualityClosure:['Alert closure',m.quality.length?closedQ/m.quality.length*100:0,'%','Closed alerts ÷ alerts'],breakdowns:['Breakdowns',m.breakdowns.length,'','Breakdown source incidents'],mttr:['Mean restore time',m.breakdowns.length?m.downtime/m.breakdowns.length:0,'min','Downtime ÷ breakdowns'],breakdownOpen:['Active breakdowns',m.breakdowns.length-closedB,'','Not closed or restored'],loss:['Indicative loss',m.loss,'$','Fictional approved-rate placeholder'],plantCount:['Plants compared',new Set(all.map(x=>x.plant)).size,'','Plants with source records'],repeatDrivers:['Repeat drivers',group([...m.breakdowns,...m.quality],x=>x.category||x.classification).filter(x=>x.value>1).length,'','Drivers appearing more than once'],enterpriseOutput:['Enterprise output',m.actual,'pcs','Total actual quantity'],critical:['Critical exceptions',[...m.breakdowns,...m.quality].filter(x=>x.severity==='Critical').length,'','Critical severity source events'],masterValues:['Master values',Object.values(state.masters).reduce((s,x)=>s+x.length,0),'','Controlled selectable identities'],sourceRecords:['Source records',all.length,'','Filtered source transactions'],auditCoverage:['Audit coverage',all.length?audited/all.length*100:100,'%','Sources with matching audit'],testPass:['Validation pass',runCoreTests().filter(x=>x.pass).length/runCoreTests().length*100,'%','Core checks passed']}}
function reportData(role=state.role){const m=metrics(),cfg=roleReportMatrix[role],all=[...m.production,...m.breakdowns,...m.quality],events=[...m.breakdowns,...m.quality],km=kpiMap(m),kpis=cfg.kpis.map(k=>({key:k,label:km[k][0],value:km[k][1],unit:km[k][2],formula:km[k][3]}));let pie,sourceCount,trend,bar,pareto,ranked;
if(role==='Operator'){pie=group(all,x=>x.id.startsWith('PRD')?'Production':x.id.startsWith('BD')?'Breakdown':'Quality');sourceCount=all.length;trend=dateSeries(d=>m.production.filter(x=>x.time.startsWith(d)).reduce((s,x)=>s+x.good,0));bar=group(m.production,'shift',x=>x.actual);pareto=group(events,x=>x.symptom||x.defect,x=>x.affected||x.ng);ranked=events.slice().sort((a,b)=>(b.affected||b.ng)-(a.affected||a.ng));}
else if(role==='Supervisor'){pie=group(all,x=>x.id.startsWith('PRD')?'Production':x.id.startsWith('BD')?'Breakdown':'Quality');sourceCount=all.length;trend=dateSeries(d=>{const p=m.production.filter(x=>x.time.startsWith(d)),pl=p.reduce((s,x)=>s+x.planned,0);return pl?p.reduce((s,x)=>s+x.actual,0)/pl*100:0});bar=group(events,'line',x=>x.loss);pareto=group(events,x=>x.category||x.classification,x=>x.loss);ranked=m.open.slice().sort((a,b)=>b.loss-a.loss);}
else if(role==='QA/QC'){pie=group(m.quality,'severity');sourceCount=m.quality.length;trend=dateSeries(d=>m.quality.filter(x=>x.time.startsWith(d)).reduce((s,x)=>s+x.ng,0));bar=group(m.quality,'classification',x=>x.ng);pareto=group(m.quality,'defect',x=>x.ng);ranked=m.quality.slice().sort((a,b)=>b.ng-a.ng);}
else if(role==='Maintenance'){pie=group(m.breakdowns,'category');sourceCount=m.breakdowns.length;trend=dateSeries(d=>m.breakdowns.filter(x=>x.time.startsWith(d)).reduce((s,x)=>s+x.durationMin,0));bar=group(m.breakdowns,'machine',x=>x.durationMin);pareto=group(m.breakdowns,'symptom',x=>x.durationMin);ranked=m.breakdowns.slice().sort((a,b)=>b.durationMin-a.durationMin);}
else if(role==='Plant Head'){pie=group(events,x=>x.id.startsWith('BD')?'Breakdown':'Quality');sourceCount=events.length;trend=dateSeries(d=>events.filter(x=>x.time.startsWith(d)).reduce((s,x)=>s+x.loss,0));bar=group(events,'line',x=>x.loss);pareto=group(events,x=>x.category||x.classification,x=>x.loss);ranked=events.slice().sort((a,b)=>b.loss-a.loss);}
else if(role==='Division Head'){pie=group(events,'plant');sourceCount=events.length;trend=dateSeries(d=>events.filter(x=>x.time.startsWith(d)).reduce((s,x)=>s+x.loss,0));bar=state.masters.plants.map(p=>{const x=m.production.filter(r=>r.plant===p),pl=x.reduce((s,r)=>s+r.planned,0);return{label:p,value:pl?x.reduce((s,r)=>s+r.actual,0)/pl*100:0}});pareto=group(events,x=>x.category||x.classification,x=>x.loss);ranked=events.slice().sort((a,b)=>b.loss-a.loss);}
else if(role==='CEO'){pie=group(events,x=>x.id.startsWith('BD')?'Breakdown loss':'Quality loss',x=>x.loss);sourceCount=events.reduce((s,x)=>s+x.loss,0);trend=dateSeries(d=>events.filter(x=>x.time.startsWith(d)).reduce((s,x)=>s+x.loss,0));bar=group(events,'plant',x=>x.loss);pareto=group(events,x=>x.category||x.classification,x=>x.loss);ranked=events.slice().sort((a,b)=>b.loss-a.loss);}
else{pie=group(all,x=>x.id.startsWith('PRD')?'Production':x.id.startsWith('BD')?'Breakdown':'Quality');sourceCount=all.length;trend=dateSeries(d=>all.filter(x=>x.time.startsWith(d)).length);bar=Object.entries(state.masters).map(([k,v])=>({label:masterMeta[k]||k,value:v.length}));pareto=group(state.audit.filter(a=>a.time.slice(0,10)>=state.filters.from&&a.time.slice(0,10)<=state.filters.to),'type');ranked=state.audit.slice().sort((a,b)=>b.time.localeCompare(a.time));}
pareto=pareto.sort((a,b)=>b.value-a.value);if(pareto.length>6){const top=pareto.slice(0,5),other=pareto.slice(5).reduce((s,x)=>s+x.value,0);if(other)top.push({label:'Other',value:other});pareto=top.sort((a,b)=>b.value-a.value)}const total=pareto.reduce((s,x)=>s+x.value,0);let running=0;pareto=pareto.map((x,i)=>({...x,cumulative:total?(running+=x.value)/total*100:0,index:i}));bar=bar.sort((a,b)=>b.value-a.value).slice(0,7);return{role,cfg,m,kpis,pie,sourceCount,trend,bar,pareto,ranked:ranked.slice(0,4)}}

const chartColors=['#119b88','#ffb84d','#e96b6b','#559fe8','#7667d9','#6abf69','#bf6cab'];function shortLabel(s,n=14){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}function emptyChart(msg='No source data in selected range'){return `<svg viewBox="0 0 400 150" role="img" aria-label="No data"><rect width="400" height="150" fill="#f7f9f9"/><text x="200" y="76" text-anchor="middle" class="chart-label">${esc(msg)}</text></svg>`}
function donutSVG(data,total,title){if(!data.length||!total)return emptyChart();let offset=0,circles=data.map((x,i)=>{const pct=x.value/total*100,c=`<circle cx="76" cy="72" r="43" fill="none" stroke="${chartColors[i%chartColors.length]}" stroke-width="22" pathLength="100" stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="${-offset}" transform="rotate(-90 76 72)"/>`;offset+=pct;return c}).join('');return `<svg viewBox="0 0 400 150" role="img" aria-label="${esc(title)} donut chart">${circles}<circle cx="76" cy="72" r="29" fill="#fff"/><text x="76" y="69" text-anchor="middle" class="chart-value">${fmtValue(total,'')}</text><text x="76" y="82" text-anchor="middle" class="chart-label">total</text>${data.slice(0,6).map((x,i)=>`<rect x="145" y="${20+i*20}" width="9" height="9" rx="2" fill="${chartColors[i%chartColors.length]}"/><text x="160" y="${28+i*20}" class="chart-label">${esc(shortLabel(x.label,18))} · ${fmtValue(x.value,'')} (${(x.value/total*100).toFixed(0)}%)</text>`).join('')}</svg>`}
function lineSVG(data,title,unit=''){if(!data.length)return emptyChart();const max=Math.max(1,...data.map(x=>x.value)),min=Math.min(0,...data.map(x=>x.value)),range=max-min||1,pts=data.map((x,i)=>`${35+i*(345/Math.max(1,data.length-1))},${123-(x.value-min)/range*94}`).join(' '),area=`35,123 ${pts} 380,123`;return `<svg viewBox="0 0 400 150" role="img" aria-label="${esc(title)} trend line chart"><line x1="35" y1="29" x2="35" y2="123" class="chart-axis"/><line x1="35" y1="123" x2="380" y2="123" class="chart-axis"/>${[0,.5,1].map(t=>`<line x1="35" y1="${29+t*94}" x2="380" y2="${29+t*94}" class="chart-gridline"/>`).join('')}<polygon points="${area}" fill="#119b88" opacity=".1"/><polyline points="${pts}" fill="none" stroke="#119b88" stroke-width="2.5"/>${data.map((x,i)=>i%Math.max(1,Math.ceil(data.length/10))===0?`<circle cx="${35+i*(345/Math.max(1,data.length-1))}" cy="${123-(x.value-min)/range*94}" r="2.5" fill="#119b88"/>`:'').join('')}<text x="31" y="32" text-anchor="end" class="chart-label">${esc(fmtValue(max,unit))}</text><text x="31" y="126" text-anchor="end" class="chart-label">${esc(fmtValue(min,unit))}</text><text x="35" y="141" class="chart-label">${esc(data[0].label.slice(5))}</text><text x="207" y="141" text-anchor="middle" class="chart-label">${esc(data[Math.floor(data.length/2)].label.slice(5))}</text><text x="380" y="141" text-anchor="end" class="chart-label">${esc(data[data.length-1].label.slice(5))}</text></svg>`}
function barSVG(data,title,unit=''){if(!data.length)return emptyChart();const max=Math.max(1,...data.map(x=>x.value)),row=122/Math.max(1,data.length);return `<svg viewBox="0 0 400 150" role="img" aria-label="${esc(title)} comparative bar chart">${data.map((x,i)=>{const y=8+i*row,w=x.value/max*225;return `<text x="4" y="${y+row*.62}" class="chart-label">${esc(shortLabel(x.label,14))}</text><rect x="100" y="${y+2}" width="${w}" height="${Math.max(8,row-5)}" rx="3" fill="${chartColors[i%chartColors.length]}"/><text x="${105+w}" y="${y+row*.62}" class="chart-value">${esc(fmtValue(x.value,unit))}</text>`}).join('')}</svg>`}
function paretoSVG(data,title,unit=''){if(!data.length)return emptyChart();const max=Math.max(1,...data.map(x=>x.value)),n=data.length,bw=270/n-7,coords=data.map((x,i)=>({x:42+i*(270/n)+4,barY:116-x.value/max*82,lineY:116-x.cumulative/100*82,...x}));return `<svg viewBox="0 0 400 150" role="img" aria-label="${esc(title)} Pareto chart with cumulative percent"><line x1="40" y1="116" x2="325" y2="116" class="chart-axis"/><line x1="40" y1="50.4" x2="325" y2="50.4" stroke="#e96b6b" stroke-dasharray="4 3"/><text x="329" y="53" class="chart-label">80%</text>${coords.map((x,i)=>`<rect x="${x.x}" y="${x.barY}" width="${bw}" height="${116-x.barY}" fill="#119b88" opacity="${.95-i*.08}"/><text x="${x.x+bw/2}" y="128" text-anchor="middle" class="chart-label">${esc(shortLabel(x.label,7))}</text>`).join('')}<polyline points="${coords.map(x=>`${x.x+bw/2},${x.lineY}`).join(' ')}" fill="none" stroke="#e96b6b" stroke-width="2"/>${coords.map(x=>`<circle cx="${x.x+bw/2}" cy="${x.lineY}" r="2.5" fill="#e96b6b"/>`).join('')}<text x="39" y="31" text-anchor="end" class="chart-label">${esc(fmtValue(max,unit))}</text><text x="325" y="31" class="chart-label">100%</text></svg>`}
